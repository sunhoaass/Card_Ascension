<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Battle Infinity</title>
  <meta name="description" content="Card Battle Infinity — tier list and card database.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1 id="siteName">Card Battle Infinity</h1>
    <div class="sub" id="updated">Loading…</div>
    <nav class="tabs">
      <button data-page="tier">Tier List</button>
      <button data-page="cards">Cards</button>
    </nav>
  </header>

  <main>
    <section id="page-tier" class="hidden"></section>

    <section id="page-cards" class="hidden">
      <div class="row" style="margin-bottom:12px">
        <input id="q" placeholder="Search card…">
        <select id="fRarity"><option value="">All rarities</option></select>
      </div>
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
