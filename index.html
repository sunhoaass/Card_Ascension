/* Layout: a phone app shell. Sticky view header, one scrolling column, fixed bottom tab bar; card pages slide over as full screens, menus rise as bottom sheets. */
:root {
  --bg: #0b0d17; --bg-2: #10131f; --surface: #161a29; --surface-2: #1f2437; --line: #2b314a;
  --fg: #eef0f8; --muted: #8d94ae; --accent: #f5b544; --accent-ink: #1f1505;
  --good: #46d6a0; --bad: #ff6b80; --scrim: rgba(4, 5, 12, .66);
  --r-common: #a3abc2; --r-rare: #4aa8ff; --r-epic: #b77bff; --r-legend: #ffc93d; --r-mythic: #ff5b4f; --r-other: #7d8aa8;
  --holo: linear-gradient(135deg, #ff5fd2, #ffd36e 35%, #58e0ff 70%, #b77bff);
  --font-display: "Chakra Petch", "IBM Plex Sans Thai", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cw: 64px; --lw: 76px; --nav-h: 62px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f2f3f8; --bg-2: #e8eaf2; --surface: #ffffff; --surface-2: #f1f2f8; --line: #d8dbe7;
    --fg: #151826; --muted: #5a6180; --accent: #b0700a; --accent-ink: #ffffff;
    --good: #12875d; --bad: #cf3550; --scrim: rgba(20, 22, 38, .45);
    --r-common: #7b8399; --r-rare: #1f7fd6; --r-epic: #8b4fe0; --r-legend: #c99200; --r-mythic: #d9342a; --r-other: #5e6a86;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f2f3f8; --bg-2: #e8eaf2; --surface: #ffffff; --surface-2: #f1f2f8; --line: #d8dbe7;
  --fg: #151826; --muted: #5a6180; --accent: #b0700a; --accent-ink: #ffffff;
  --good: #12875d; --bad: #cf3550; --scrim: rgba(20, 22, 38, .45);
  --r-common: #7b8399; --r-rare: #1f7fd6; --r-epic: #8b4fe0; --r-legend: #c99200; --r-mythic: #d9342a; --r-other: #5e6a86;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }

/* header */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 10px 8px; display: flex; flex-direction: column; gap: 8px; }
.hrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.htitle { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; line-height: 1.15; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.htitle small { display: block; font: 500 11px var(--font-body); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.ib { width: 38px; height: 38px; flex: none; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.ib svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 13px; font: 600 12.5px var(--font-display); letter-spacing: .04em; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.dash { border-style: dashed; }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--bg-2) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.nav button { border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0; border-radius: 12px; font-size: 11.5px; font-weight: 500; }
.nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }

/* cards */
.card { position: relative; width: var(--cw); aspect-ratio: 282 / 383; max-width: 100%; flex: none; border-radius: 8px; overflow: hidden; background: var(--surface-2);
  box-shadow: 0 0 0 1.5px var(--rc, var(--line)); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; touch-action: pan-x pan-y; }
.card img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
.card[data-r="Secret"] { box-shadow: none; padding: 1.5px; background: var(--holo); }
.card[data-r="Secret"] img { border-radius: 7px; }
.card .ph-n { position: absolute; inset: auto 0 0; padding: 14px 4px 4px; font: 600 10px/1.2 var(--font-display); color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.85)); text-align: center; }
.card.lift { transform: scale(.94); opacity: .5; }
.ghost { position: fixed; z-index: 90; pointer-events: none; will-change: transform; transition: none; transform: rotate(3deg) scale(1.08); box-shadow: 0 16px 34px rgba(0,0,0,.5), 0 0 0 2px var(--accent); opacity: .96; }
.ph { width: var(--cw); aspect-ratio: 282 / 383; flex: none; border-radius: 8px; border: 2px dashed var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }

/* tier board */
.hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
.board { display: flex; flex-direction: column; gap: 6px; }
.trow { display: grid; grid-template-columns: var(--lw) minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-height: calc(var(--cw) * 1.358 + 14px); }
.tlab { border: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px 4px; font-family: var(--font-display); font-weight: 700; line-height: 1.05; overflow-wrap: anywhere; color: #14161f; }
.zone { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding: 7px; min-width: 0; transition: background .12s; }
.zone.over, .poolz.over { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.addteam { display: block; width: 100%; margin: 4px 0 16px; padding: 14px; border-radius: 14px; border: 1.5px dashed var(--line); background: none; color: var(--muted); font-weight: 700; font-size: 15px; }
.gchip { display: inline-flex; align-items: center; gap: 6px; }
.gchip small { font-size: 10.5px; opacity: .7; font-weight: 600; }
.gchip .gdot { width: 8px; height: 8px; border-radius: 50%; background: var(--gc); flex: none; }
.gchip .gdot.gdrb { background: conic-gradient(#ff6b6b, #ffd166, #6be3a4, #6aa8ff, #c39bff, #ff6b6b); }
.gchip[aria-pressed="true"] .gdot { box-shadow: 0 0 0 1.5px var(--accent-ink); }
.grades.hgr { margin-top: 12px; }
.card.graded { box-shadow: 0 0 0 1.5px var(--gc); }
.card .gov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.card[data-r="Secret"] .gov { inset: 1.5px; width: calc(100% - 3px); height: calc(100% - 3px); border-radius: 8px; }
.addteam:hover { border-color: var(--accent); color: var(--accent); }
body.shot .addteam { display: none !important; }
.tools .blk:first-child { margin-top: 0; }
.addt { width: var(--cw); aspect-ratio: 282 / 383; flex: none; border-radius: 8px; border: 1.5px dashed var(--line); background: none; color: var(--muted); font-size: 22px; display: grid; place-items: center; padding: 0; }
.sec { margin-top: 18px; }
.sech { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 8px; }
.sech h2 { margin: 0; font: 700 15px var(--font-display); letter-spacing: .05em; text-transform: uppercase; }
.sech span { color: var(--muted); font-size: 12px; }
.poolz { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; min-height: 90px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.empty { color: var(--muted); font-size: 13px; padding: 14px 6px; }

/* deck */
.deck { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.deck + .deck { margin-top: 12px; }
.dhead { display: flex; align-items: center; gap: 10px; padding: 10px 10px 4px 14px; }
.dhead .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.dhead h3 { flex: 1; min-width: 0; margin: 0; font: 700 17px var(--font-display); letter-spacing: .03em; }
.dhead .mode { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.slots { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 7px; padding: 8px 12px 6px; }
.scell { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.slot { position: relative; width: 100%; aspect-ratio: 282 / 383; border-radius: 9px; border: 1.5px dashed var(--line); background: var(--bg-2); display: grid; place-items: center; color: var(--muted); padding: 0; }
.slot .n { font: 700 20px var(--font-display); opacity: .5; }

/* analysis */

/* camera mode */
body.shot .nav, body.shot .hdr .chips, body.shot .hdr .ib, body.shot .hint, body.shot .sec, body.shot .addt, body.shot .fab, body.shot .an { display: none !important; }

.mode-row { display: flex; gap: 6px; margin: 0 0 10px; }

@media (max-width: 380px) { :root { --cw: 56px; --lw: 66px; } .hero { grid-template-columns: 108px minmax(0, 1fr); } .hero .card { width: 108px; } .grid { gap: 8px; } }

@media (min-width: 1400px) { :root { --cw: 96px; --lw: 128px; } }

/* ===== refresh: glass surfaces, ambient light, floating nav ===== */
:root {
  --bg: #07080e; --bg-2: #0d0f19; --surface: #121524; --surface-2: #1a1e30; --line: #262b42;

  --glow: 0 10px 30px -12px rgba(247, 184, 75, .55);

}

  --glass: rgba(255, 255, 255, .72); --glass-2: rgba(20, 24, 50, .035); --edge: rgba(20, 24, 50, .08); --edge-hi: rgba(20, 24, 50, .12);
  --accent: #c27a06; --accent-2: #e2611b; --accent-ink: #fff; --glow: 0 10px 26px -12px rgba(194, 122, 6, .55);
  --shadow: 0 1px 2px rgba(20,24,50,.05), 0 10px 28px -16px rgba(20,24,50,.25); } }
:root[data-theme="light"] {
  --bg: #f3f4f9; --bg-2: #eceef6; --surface: #ffffff; --surface-2: #f2f3f9; --line: #dfe2ee;
  --glass: rgba(255, 255, 255, .72); --glass-2: rgba(20, 24, 50, .035); --edge: rgba(20, 24, 50, .08); --edge-hi: rgba(20, 24, 50, .12);
  --accent: #c27a06; --accent-2: #e2611b; --accent-ink: #fff; --glow: 0 10px 26px -12px rgba(194, 122, 6, .55);
  --shadow: 0 1px 2px rgba(20,24,50,.05), 0 10px 28px -16px rgba(20,24,50,.25); }
body { letter-spacing: -.005em; }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(60% 40% at 0% 0%, rgba(124, 92, 255, .16), transparent 70%), radial-gradient(50% 35% at 100% 0%, rgba(247, 184, 75, .10), transparent 70%), radial-gradient(60% 40% at 50% 100%, rgba(56, 189, 248, .07), transparent 70%); }
body { background: var(--bg); }

/* header: frosted, sticky */
.hdr { background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: saturate(150%) blur(16px); -webkit-backdrop-filter: saturate(150%) blur(16px);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); padding-block: 12px 10px; border-bottom: 1px solid transparent; }
.htitle { font-size: 24px; letter-spacing: 0; }

.ib { border-radius: 12px; border: 1px solid var(--edge); background: var(--glass-2); transition: background .15s, border-color .15s, transform .1s; }
.ib:hover { border-color: var(--edge-hi); background: color-mix(in srgb, var(--fg) 8%, transparent); }
.ib:active, .btn:active, .chip:active, .nav button:active { transform: scale(.96); }
