<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1235">
<title>Silver Scene Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Card Battle Infinity — W7 round 2 mockup: the card detail background after the owner's clip (does NOT touch the live site)
  Layers (images/silver/, cut from the owner's frames · owner's decision 2026-10-26, rule 10 exception):
    sky.webp (sun + wings + blue roots + light fall) · gold.webp (gold flecks + ring) · city.webp (dark city) ·
    palace.webp (white crystal palace) · dust0/1.webp (palace dust) · fog.webp
  Code: the sun's top + ring (the frame cut them off) · light running down the light fall · sparkles · the 13 s cycle
  Cycle (like the clip): calm → gold flecks light up → dust rises where the light fall lands → the dark city turns into
  the crystal palace → stays → the palace breaks into dust → the dark city comes back · one-shot animations per phase
  (nothing moves while it stays) · transform / opacity only
-->
<style>
:root {
  --gold: #d8b46a; --gold-hi: #f3dca0; --ink: #efe6d2; --ink-dim: #b3a88f;
  --night-top: #161a3e; --night-low: #110a28;
  --glass: rgba(8, 11, 30, .74); --glass-line: color-mix(in srgb, #d8b46a 55%, transparent);
  --fall: radial-gradient(closest-side, rgba(255, 255, 255, .95), rgba(205, 220, 255, .45) 45%, rgba(190, 205, 255, 0));
  --spark: radial-gradient(circle, #fff 0 25%, rgba(210, 225, 255, .7) 45%, rgba(190, 210, 255, 0) 70%);
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night-low); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
img { display: block; max-width: none; }
.scene { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(var(--night-top), var(--night-low) 70%); }
.scene > * { position: absolute; pointer-events: none; }
.sun { left: 0; top: 0; }
.gold, .city, .palace, .dust { opacity: 0; }
.city { opacity: 1; }
.fogwrap { left: -40px; right: -40px; bottom: -6px; height: 32%; overflow: hidden; }
.fog { position: absolute; left: 0; top: 0; height: 100%; display: flex; animation: fog 70s linear infinite; }
.fog img { height: 100%; width: auto; }
@keyframes fog { to { transform: translateX(-50%); } }
.fall { width: 0; }
.fall i { position: absolute; left: -9px; top: 0; width: 18px; height: 70px; background: var(--fall); opacity: 0; animation: fall 2.6s linear infinite; }
.fall i:nth-child(2) { animation-delay: -.9s; width: 12px; left: -6px; }
.fall i:nth-child(3) { animation-delay: -1.7s; }
@keyframes fall { 0% { transform: translateY(0) scaleY(.6); opacity: 0; } 15% { opacity: .9; } 80% { opacity: .6; } 100% { transform: translateY(var(--len, 300px)) scaleY(1.3); opacity: 0; } }
.spark { width: 6px; height: 6px; margin: -3px 0 0 -3px; background: var(--spark); opacity: 0; animation: tw 3.4s ease-in-out infinite; }
@keyframes tw { 0%, 100% { opacity: 0; transform: scale(.4); } 45% { opacity: 1; transform: scale(1); } }

/* the card + boxes as on the live page (for coverage only) */
.fore { position: fixed; inset: 0; pointer-events: none; transition: opacity 300ms var(--ease); }
.fore.off { opacity: 0; }
.top { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px;
  background: linear-gradient(180deg, rgba(5, 9, 34, .82), rgba(5, 9, 34, 0)); font: 700 12px Cinzel, serif; letter-spacing: .05em; color: var(--gold-hi); }
.top b { padding: 10px 12px; border-radius: 6px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-line); }
.card { position: absolute; border-radius: 12px; overflow: hidden; box-shadow: 0 18px 50px rgba(0, 0, 0, .55); }
.card img { width: 100%; height: 100%; object-fit: cover; }
.box { position: absolute; border-radius: 8px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-line); padding: 8px 10px; font: 700 12px Cinzel, serif; color: var(--gold-hi); }
.dock { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: linear-gradient(0deg, rgba(5, 8, 30, .9) 38%, rgba(5, 8, 30, 0)); }

/* controls */
.panel { position: fixed; z-index: 5; right: 10px; bottom: calc(8px + env(safe-area-inset-bottom)); width: min(320px, calc(100vw - 20px)); padding: 10px 12px 12px; border-radius: 12px;
  background: rgba(8, 11, 30, .9); box-shadow: inset 0 0 0 1px var(--glass-line), 0 10px 30px rgba(0, 0, 0, .5); font-size: 13px; }
.panel.min .rows { display: none; }
.panel h2 { margin: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 700 13px Cinzel, serif; color: var(--gold-hi); }
.phase { font: 600 12px Inter, sans-serif; color: var(--ink-dim); }
.row { margin-top: 10px; }
.row > span { display: block; margin-bottom: 5px; color: var(--ink-dim); font-size: 12px; }
.seg { display: flex; gap: 6px; }
button { flex: 1; min-height: 40px; border: 0; border-radius: 8px; font: 600 13px Inter, sans-serif; color: var(--ink); background: rgba(255, 255, 255, .07);
  box-shadow: inset 0 0 0 1px rgba(216, 180, 106, .35); cursor: pointer; transition: transform 150ms var(--ease); }
button:active { transform: scale(.96); }
button[aria-pressed="true"] { color: #23190a; background: linear-gradient(180deg, #f6e2aa, #d8b46a 48%, #a07a2e); }
.panel h2 button { flex: none; min-height: 32px; min-width: 40px; }
@media (prefers-reduced-motion: reduce) { .fog, .fall i, .spark { animation: none; } }
</style>
</head>
<body>
<div class="scene" id="scene">
  <img class="sky" id="sky" src="../images/silver/sky.webp" alt="">
  <div class="fall" id="fall"><i></i><i></i><i></i></div>
  <canvas class="sun" id="sun"></canvas>
  <img class="gold" id="gold" src="../images/silver/gold.webp" alt="">
  <img class="city" id="city" src="../images/silver/city.webp" alt="">
  <img class="palace" id="palace" src="../images/silver/palace.webp" alt="">
  <img class="dust" id="dust0" src="../images/silver/dust0.webp" alt="">
  <img class="dust" id="dust1" src="../images/silver/dust1.webp" alt="">
  <div class="fogwrap"><div class="fog"><img src="../images/silver/fog.webp" alt=""><img src="../images/silver/fog.webp" alt=""></div></div>
</div>
<div class="fore" id="fore">
  <div class="top"><b>‹ Back</b><span>Dragon Emperor Monarch</span></div>
  <div class="card" id="card"><img src="clean-art/dragon-emperor-monarch.webp" alt=""></div>
  <div class="box" id="b0">Tier S</div><div class="box" id="b1">Passive / Skill</div><div class="box" id="b2">Weakness</div><div class="box" id="b3">Strongest</div>
  <div class="dock"></div>
</div>

<section class="panel" id="panel" aria-label="Mockup controls">
  <h2>Silver scene <span class="phase" id="phase">—</span><button type="button" id="min" aria-label="Hide controls">▾</button></h2>
  <div class="rows">
    <div class="row seg"><button type="button" id="replay">Replay</button><button type="button" id="cardBtn" aria-pressed="true">Card</button></div>
    <div class="row"><span>Wings / sun size</span><div class="seg" data-k="size"><button type="button" data-v="std" aria-pressed="true">Like the site</button><button type="button" data-v="big">Bigger</button></div></div>
    <div class="row"><span>Gold</span><div class="seg" data-k="gold"><button type="button" data-v="clip" aria-pressed="true">Stays (clip)</button><button type="button" data-v="flash">Flash + fade</button></div></div>
    <div class="row"><span>City / palace</span><div class="seg" data-k="ground"><button type="button" data-v="low" aria-pressed="true">Lower</button><button type="button" data-v="high">Higher</button></div></div>
  </div>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  // picture facts (images/silver): sky 1369 × 898, sun at (698, 216) r 80 · gold box (322, 0) 752 × 352 ·
  // city: frame 1369 × 768, file from row 61 · palace: frame 1349 × 784, file from row 219 · light fall ends ≈ row 790
  const SKY = { w: 1369, h: 898, cx: 698, cy: 216, r: 80, fallEnd: 790 };
  const opt = { size: "std", gold: "clip", ground: "low" };
  let L = {};

  /* ---------- layout (the same rules as the live page: sun under the 44px top bar, card right under the sun) ---------- */
  function sunOf(W, H) {
    const portrait = H >= W;
    let R = clamp(Math.min(W, H * 0.55) * (portrait ? (H < 780 ? 0.09 : 0.118) : 0.15), 34, 84);
    R = Math.max(R, SKY.r * (W + 40) / SKY.w);               // the wings always reach both screen edges
    if (opt.size === "big") R *= 1.25;
    const sy = Math.max((portrait ? clamp(H * 0.108, 84, 150) : clamp(H * 0.135, 84, 170)) - 26, 44 + 10 + R);
    return { R, sx: W / 2, sy, portrait };
  }
  const put = (n, x, y, w, h) => Object.assign(n.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  function layout() {
    const W = innerWidth, H = innerHeight, sun = sunOf(W, H), s = sun.R / SKY.r;
    const dx = sun.sx - SKY.cx * s, dy = sun.sy - SKY.cy * s;
    put($("sky"), dx, dy, SKY.w * s, SKY.h * s);
    put($("gold"), dx + 322 * s, dy, 752 * s, 352 * s);
    // the ground (dark city / crystal palace): bottom of the screen, wider than a phone (the castle + gate stay centred)
    // tall screens: the ground grows until its top overlaps the sky picture's bottom (no empty dark band between them)
    const skyB = dy + SKY.h * s;
    let GW = sun.portrait ? W * (opt.ground === "high" ? 2.25 : 1.9) : W * (opt.ground === "high" ? 1.2 : 1.02);
    GW = Math.max(GW, 1369 * (H - skyB + 70) / (768 - 61));
    const k = GW / 1369, gh = 768 * k, gb = H + (sun.portrait ? 0 : (opt.ground === "high" ? 0 : Math.min(gh * 0.14, Math.max(0, gh - 61 * k - (H - skyB + 70)))));
    put($("city"), (W - GW) / 2, gb - gh + 61 * k, GW, (768 - 61) * k);
    const k2 = GW / 1349;
    const pb = { x: (W - GW) / 2, y: gb - 784 * k2 + 219 * k2, w: GW, h: (784 - 219) * k2 };
    ["palace", "dust0", "dust1"].forEach((id) => put($(id), pb.x, pb.y, pb.w, pb.h));
    // the light fall: from under the sun down to where it lands (the dust rises from there)
    const f0 = sun.sy + sun.R * 1.6, f1 = Math.max(f0 + 40, dy + SKY.fallEnd * s);
    put($("fall"), sun.sx, f0, 0, 0); $("fall").style.setProperty("--len", Math.round(f1 - f0) + "px");
    ["dust0", "dust1"].forEach((id) => { $(id).style.transformOrigin = `50% ${Math.round(((f1 - pb.y) / pb.h) * 100)}%`; });
    drawSun(sun);
    // the card as on the live page (coverage)
    const fh = H - 44 - 84, top = Math.max(8, sun.sy + sun.R + 12 - 44);
    let cw, T;
    if (!sun.portrait && W >= 768) { cw = Math.round(Math.min(560, W * 0.42, (fh - top - 150) * 0.714)); T = 44 + top; }
    else { cw = Math.round(clamp(Math.min(W * 0.74, (fh - top - 252) / 1.4), 110, 520)); T = 44 + top; }
    const ch = Math.round(cw * 1.4), cl = Math.round((W - cw) / 2);
    put($("card"), cl, T, cw, ch);
    const boxes = [0, 1, 2, 3].map((i) => $("b" + i));
    if (!sun.portrait && W >= 768) {
      const bw = clamp(cl - 48, 160, 380);
      boxes.forEach((b, i) => put(b, i % 2 ? cl + cw + 32 : cl - 32 - bw, T + (i < 2 ? ch * 0.06 : ch * 0.7), bw, 90));
    } else {
      const gw = Math.min(W - 20, 640), x0 = (W - gw) / 2, bw = (gw - 8) / 2;
      boxes.forEach((b, i) => put(b, x0 + (i % 2) * (bw + 8), T + ch + 14 + (i < 2 ? 0 : 68), bw, 60));
    }
    L = { W, H, sun, s };
    sparks();
  }
  // the sun's top + its ring (the frame cut them off): disc filled from the top, fading out by the middle
  function drawSun({ R, sx, sy }) {
    const cv = $("sun"), d = Math.min(devicePixelRatio || 1, 2), S = R * 3;
    cv.width = Math.round(S * 2 * d); cv.height = Math.round(S * 2 * d);
    put(cv, sx - S, sy - S, S * 2, S * 2);
    const c = cv.getContext("2d"); c.setTransform(d, 0, 0, d, 0, 0); c.translate(S, S);
    let g = c.createLinearGradient(0, -R, 0, 0);
    g.addColorStop(0, "rgba(10,10,18,1)"); g.addColorStop(0.55, "rgba(10,10,18,.85)"); g.addColorStop(1, "rgba(10,10,18,0)");
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, R * 1.005, 0, Math.PI * 2); c.fill();
    // ring: strongest on top (where the frame had none), gone by the sides
    for (const [w, a] of [[R * 0.42, 0.18], [R * 0.16, 0.55], [R * 0.06, 0.9]]) {
      g = c.createLinearGradient(0, -R * 1.3, 0, -R * 0.1);
      g.addColorStop(0, `rgba(240,242,255,${a})`); g.addColorStop(0.7, `rgba(240,242,255,${a * 0.4})`); g.addColorStop(1, "rgba(240,242,255,0)");
      c.strokeStyle = g; c.lineWidth = w; c.beginPath(); c.arc(0, 0, R * 1.08, Math.PI * 1.05, Math.PI * 1.95); c.stroke();
    }
  }
  function sparks() {
    document.querySelectorAll(".spark").forEach((n) => n.remove());
    const { W, H, sun } = L;
    let seed = 11; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("i"); s.className = "spark";
      const a = Math.PI * (0.15 + r() * 0.7), d = sun.R * (2 + r() * 5);
      s.style.left = (sun.sx + Math.cos(a) * d * (r() < 0.5 ? -1 : 1) * 1.6) + "px"; s.style.top = Math.min(H * 0.8, sun.sy + Math.sin(a) * d) + "px";
      s.style.animationDelay = (-r() * 3.4).toFixed(2) + "s"; s.style.animationDuration = (2.8 + r() * 2.4).toFixed(2) + "s";
      $("scene").appendChild(s);
    }
  }

  /* ---------- the 13 s cycle, one-shot animations per phase (nothing animates while the palace stays) ---------- */
  const E = "cubic-bezier(.2,.7,.2,1)";
  const PH = [["calm", 1500], ["gold", 3000], ["form", 3500], ["stay", 3000], ["fade", 1800], ["gap", 700]];
  let anims = [], timer = 0, goldTimer = 0;
  const run = (n, kf, dur, ez) => { const a = n.animate(kf, { duration: dur, fill: "forwards", easing: ez || "linear" }); anims.push(a); return a; };
  function settle() { anims.forEach((a) => { try { a.commitStyles(); } catch (e) {} a.cancel(); }); anims = []; }
  function phase(i) {
    settle();
    const [name, dur] = PH[i];
    $("phase").textContent = name;
    const gold = $("gold"), city = $("city"), pal = $("palace"), d0 = $("dust0"), d1 = $("dust1");
    if (name === "gold" && opt.gold === "clip") run(gold, [{ opacity: 0 }, { opacity: 1, offset: 0.25 }, { opacity: 0.7, offset: 0.45 }, { opacity: 1 }], 1400, "ease-out");
    if (name === "form") {
      // dust shoots up from where the light fall lands, spreads into the palace's shape, the palace solidifies
      [[d0, "-4%"], [d1, "5%"]].forEach(([d, x], j) => run(d, [
        { opacity: 0, transform: `translate(${x}, 6%) scale(.12, .3)` }, { opacity: 1, offset: 0.12 },
        { opacity: 1, transform: "none", offset: 0.62 + j * 0.04 }, { opacity: 0, transform: "none" }], dur, E));
      run(pal, [{ opacity: 0 }, { opacity: 0, offset: 0.35 }, { opacity: 1, offset: 0.85 }, { opacity: 1 }], dur, "ease-in-out");
      run(city, [{ opacity: 1 }, { opacity: 1, offset: 0.3 }, { opacity: 0, offset: 0.85 }, { opacity: 0 }], dur, "ease-in-out");
    }
    if (name === "fade") {
      [[d0, "-5%", "-12%"], [d1, "6%", "-17%"]].forEach(([d, x, y]) => run(d, [
        { opacity: 0, transform: "none" }, { opacity: 1, offset: 0.18 }, { opacity: 0, transform: `translate(${x}, ${y}) scale(1.08)` }], dur, "ease-in"));
      run(pal, [{ opacity: 1 }, { opacity: 0, offset: 0.6 }, { opacity: 0 }], dur, "ease-in");
      run(city, [{ opacity: 0 }, { opacity: 0, offset: 0.3 }, { opacity: 1 }], dur, "ease-out");
      if (opt.gold === "clip") run(gold, [{ opacity: 1 }, { opacity: 1, offset: 0.25 }, { opacity: 0 }], dur, "ease-in");
    }
    timer = setTimeout(() => phase((i + 1) % PH.length), dur);
  }
  // gold option 2: a flare that fades, twice per cycle
  function flare() {
    run($("gold"), [{ opacity: 0 }, { opacity: 1, offset: 0.15 }, { opacity: 0.35, offset: 0.45 }, { opacity: 0.7, offset: 0.6 }, { opacity: 0 }], 2600, "ease-in-out");
    goldTimer = setTimeout(flare, 6500);
  }
  function start() {
    clearTimeout(timer); clearTimeout(goldTimer);
    anims.forEach((a) => a.cancel()); anims = [];
    ["gold", "city", "palace", "dust0", "dust1"].forEach((id) => { $(id).style.opacity = ""; $(id).style.transform = ""; });
    if (rm) { $("gold").style.opacity = 1; $("phase").textContent = "still (reduced motion)"; return; }
    if (opt.gold === "flash") goldTimer = setTimeout(flare, 1500);
    phase(0);
  }

  /* ---------- controls ---------- */
  document.querySelectorAll(".seg[data-k]").forEach((seg) => seg.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    opt[seg.dataset.k] = b.dataset.v;
    seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    layout(); start();
  }));
  $("replay").addEventListener("click", start);
  $("cardBtn").addEventListener("click", (e) => { const on = $("fore").classList.toggle("off"); e.currentTarget.setAttribute("aria-pressed", String(!on)); });
  $("min").addEventListener("click", (e) => { const m = $("panel").classList.toggle("min"); e.currentTarget.textContent = m ? "▴" : "▾"; });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) start(); });
  let rt = 0; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 120); });
  layout(); start();
})();
</script>
</body>
</html>
