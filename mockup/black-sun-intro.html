<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071552">
<title>Black Sun Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Card Battle Infinity — "Black Sun Intro" mockup v2 (does NOT touch the live site)
  Backdrop: painted once (canvas → <img>), moved with paused Web Animations by finger / phone tilt.
  Card: real 3D only while it moves (spin, drag, flick, spring back); flat 2D at rest.
  Every per-frame update uses paused Web Animations (currentTime), never style.transform (PROGRESS §4.1).
  rAF loops stop by themselves (intro ~2.6 s, card physics until it settles, parallax until it settles).
  URL flags for testing: ?lite  ?full  ?fps
-->
<style>
:root {
  --gold: #d8b46a; --gold-hi: #f3dca0; --gold-lo: #8a6a32; --silver: #c9cfdb;
  --wine: #8e2a3a; --wine-hi: #c24a5e;
  --brass: linear-gradient(180deg, #2e2617, #1c170e);
  --brass-gold: linear-gradient(180deg, #f6e2aa, #d8b46a 48%, #a07a2e);
  --on-gold: #23190a;
  --ink: #efe6d2; --ink-dim: #b3a88f; --ink-faint: #7d7563;
  --lamp: #ffd48a;
  --panel-fill: linear-gradient(180deg, rgba(25, 31, 52, 0.98), rgba(14, 18, 34, 0.98));
  --r-normal: #c9cfdb;   --r-normal-2: #575e6e;
  --r-shiny: #ecc768;    --r-shiny-2: #8f6519;
  --r-secret: #c9344b;   --r-secret-2: #16040a;
  --r-divine: #fff4d8;   --r-divine-2: #d6ad5c;
  --r-cosmic: #8f7dff;   --r-cosmic-2: #3150c4;
  --r-rainbow: conic-gradient(from 0deg, #e8607a, #e9a75a, #e8dc78, #7fd39a, #69b9e0, #8a7be0, #d36cc0, #e8607a);
  --r-ascended: conic-gradient(from 0deg, #fffaf0, #a9eef5, #c5a8f5, #f5b4dc, #f8e7a8, #b4f0d2, #fffaf0);
  --atk: #e99a7f; --hp: #94d4a9; --good: #94d49c; --bad: #e57a87;
  --t-ss: #d75d80; --t-s: #e09c4c; --t-a: #d9c262;
  --font-display: "Cinzel", "Cormorant SC", Georgia, serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-chip: 6px; --r-card: 8px; --r-panel: 12px;
  --orn-tl: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g fill='none' stroke='%23000' stroke-width='1.7' stroke-linecap='round'><path d='M2 31V13Q2 2 13 2H31'/><path d='M7 31V17Q7 7 17 7H31' stroke-width='.9'/><path d='M12.5 12.5c3.6-2.4 7.4.2 6 3.6-1.1 2.7-5.3 2.2-4.6-.9'/></g><circle cx='4.6' cy='4.6' r='2.5' fill='%23000'/></svg>");
  --orn-tr: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g transform='translate(32 0) scale(-1 1)'><g fill='none' stroke='%23000' stroke-width='1.7' stroke-linecap='round'><path d='M2 31V13Q2 2 13 2H31'/><path d='M7 31V17Q7 7 17 7H31' stroke-width='.9'/><path d='M12.5 12.5c3.6-2.4 7.4.2 6 3.6-1.1 2.7-5.3 2.2-4.6-.9'/></g><circle cx='4.6' cy='4.6' r='2.5' fill='%23000'/></g></svg>");
  --orn-bl: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g transform='translate(0 32) scale(1 -1)'><g fill='none' stroke='%23000' stroke-width='1.7' stroke-linecap='round'><path d='M2 31V13Q2 2 13 2H31'/><path d='M7 31V17Q7 7 17 7H31' stroke-width='.9'/><path d='M12.5 12.5c3.6-2.4 7.4.2 6 3.6-1.1 2.7-5.3 2.2-4.6-.9'/></g><circle cx='4.6' cy='4.6' r='2.5' fill='%23000'/></g></svg>");
  --orn-br: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g transform='rotate(180 16 16)'><g fill='none' stroke='%23000' stroke-width='1.7' stroke-linecap='round'><path d='M2 31V13Q2 2 13 2H31'/><path d='M7 31V17Q7 7 17 7H31' stroke-width='.9'/><path d='M12.5 12.5c3.6-2.4 7.4.2 6 3.6-1.1 2.7-5.3 2.2-4.6-.9'/></g><circle cx='4.6' cy='4.6' r='2.5' fill='%23000'/></g></svg>");
  --orn-s: 22px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --t-fast: 150ms; --t-med: 250ms; --t-slow: 400ms;
  --top-h: 52px;
  --dock-h: 84px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  /* card size: room for the label row above (74) + ring and Details below (~128) */
  --cw: clamp(130px, min(58vw, calc((100dvh - var(--top-h) - var(--dock-h) - var(--safe-b) - 214px) * 0.714)), 260px);
  --ch: calc(var(--cw) * 1.4);
  --th: max(4px, calc(var(--cw) * .024));   /* card thickness */
  --lvl: #ecc768;
}
@media (orientation: landscape) and (min-width: 720px) {
  :root { --cw: clamp(140px, calc((100dvh - var(--top-h) - var(--dock-h) - 170px) * 0.714), 260px); }
}
* { box-sizing: border-box; }
html { background: #050a26; color-scheme: dark; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font-family: var(--font-body); color: var(--ink); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }

/* ---------------- Backdrop (same as v1) ---------------- */
.stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
.par { position: absolute; inset: 0; will-change: transform; }
.sky { position: absolute; inset: -26px; height: calc(100lvh + 52px); }
.sky .bg, .sky .pulse { position: absolute; inset: 0; width: 100%; height: 100%; }
.sky .corona { position: absolute; left: 0; top: 0; width: 100%; }
.bg { opacity: 0; transition: opacity 700ms var(--ease); }
.bg.is-on { opacity: 1; }
.corona { opacity: 0; transition: opacity 500ms var(--ease); }
.corona.is-on { opacity: 1; }
.pulse { overflow: hidden; opacity: 0; transition: opacity 900ms var(--ease); -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
.pulse.is-on { opacity: 1; }
.pulse i {
  position: absolute; left: var(--sx, 50%); top: var(--sy, 12%);
  width: var(--pr, 1600px); height: var(--pr, 1600px); margin: calc(var(--pr, 1600px) / -2) 0 0 calc(var(--pr, 1600px) / -2);
  border-radius: 50%;
  background: radial-gradient(circle, transparent 38%, rgba(235, 240, 255, 0) 41%, rgba(240, 244, 255, .95) 46%, rgba(255, 246, 222, .9) 48.5%, rgba(220, 230, 255, 0) 52%);
  transform: scale(.06); opacity: 0;
  animation: pulse-out 4.2s cubic-bezier(.35, .1, .4, 1) infinite;
}
.pulse i:nth-child(2) { animation-delay: 2.1s; }
@keyframes pulse-out { 0% { transform: scale(.06); opacity: 0; } 8% { opacity: 1; } 70% { opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
.sparks { position: absolute; inset: -26px; pointer-events: none; }
.sparks i {
  position: absolute; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%;
  background: #fff3c4; box-shadow: 0 0 6px 2px rgba(255, 206, 110, .75), 0 0 16px 4px rgba(255, 190, 80, .25);
  opacity: 0; transform: scale(.4); animation: spark 3.4s ease-in-out infinite;
}
.sparks i.sm { width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; }
@keyframes spark { 0%, 100% { opacity: 0; transform: scale(.4); } 45% { opacity: 1; transform: scale(1); } 60% { opacity: .85; transform: scale(.9); } }
.fog-wrap { position: absolute; left: -40px; right: -40px; bottom: -10px; height: 40%; overflow: hidden; pointer-events: none; }
.fog { position: absolute; left: 0; top: 0; height: 100%; width: 200%; display: flex; animation: fog-slide 46s linear infinite; }
.fog img { width: 50%; height: 100%; flex: none; display: block; }
@keyframes fog-slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity 600ms var(--ease); }
.dust.is-out { opacity: 0; }

/* ---------------- Top bar ---------------- */
.top {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5; height: var(--top-h);
  display: flex; align-items: center; gap: 8px; padding: 0 10px 0 16px;
  background: linear-gradient(180deg, rgba(5, 9, 34, .78), rgba(5, 9, 34, 0));
}
.top__t { flex: 1; min-width: 0; line-height: 1.15; }
.top__t b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .06em; color: var(--gold-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top__t small { display: block; font-size: 11px; color: var(--ink-dim); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top__t small em { font-style: normal; color: var(--gold); margin-left: 4px; }
.ibtn {
  position: relative; flex: none; min-width: 40px; height: 40px; padding: 0 10px; border-radius: var(--r-chip);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--gold-hi);
  background: rgba(20, 22, 40, .55); box-shadow: inset 0 0 0 1px rgba(216, 180, 106, .45);
  transition: transform var(--t-fast) var(--ease);
}
.ibtn svg { width: 18px; height: 18px; }
.ibtn[hidden] { display: none; }
.ibtn.is-on { color: var(--on-gold); background: var(--brass-gold); }
.press:active { transform: scale(.96); }
.press::after { content: ""; position: absolute; inset: -3px; border-radius: inherit; pointer-events: none; box-shadow: 0 0 0 2px var(--gold-hi), 0 0 14px rgba(243, 220, 160, .6); opacity: 0; }
.press.is-ring::after { animation: ring .4s var(--ease); }
@keyframes ring { from { opacity: .9; transform: scale(.9); } to { opacity: 0; transform: scale(1.12); } }

/* ---------------- Foreground ---------------- */
.fore { position: fixed; left: 0; right: 0; top: var(--top-h); bottom: calc(var(--dock-h) + var(--safe-b)); z-index: 2; pointer-events: none; }
.fore .par { pointer-events: none; }

/* card wrapper: positioned by JS (left/top) — no transform of its own except the card-switch slide */
.card-wrap { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); pointer-events: auto; touch-action: none; opacity: 0; outline: none; cursor: grab; }
.card-wrap.is-in { opacity: 1; transition: opacity 420ms var(--ease); }
.card-wrap.is-grab { cursor: grabbing; }
.zoom { position: absolute; inset: 0; transition: transform 380ms var(--ease); }
.fore.is-zoom .zoom { transform: translateY(var(--zy, 0px)) scale(var(--zs, 1.4)); }
.tilt, .rotor { position: absolute; inset: 0; }
.face { position: absolute; inset: 0; }
/* REST = flat 2D: one face, no edges, no 3D transform (§4.1) */
.card-wrap:not(.is-3d) .face--back, .card-wrap:not(.is-3d) .edge { display: none; }
/* MOVING = real 3D with thickness */
.card-wrap.is-3d .zoom { perspective: 1100px; }
.card-wrap.is-3d .tilt, .card-wrap.is-3d .rotor { transform-style: preserve-3d; }
.card-wrap.is-3d .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: translateZ(calc(var(--th) / 2)); }
.card-wrap.is-3d .face--back { transform: rotateY(180deg) translateZ(calc(var(--th) / 2)); }
.edge { position: absolute; background: var(--edge, linear-gradient(90deg, #8f6519, #ecc768 50%, #8f6519)); }
.edge--l { top: 7px; bottom: 7px; left: calc(var(--th) / -2); width: var(--th); transform: rotateY(-90deg); }
.edge--r { top: 7px; bottom: 7px; right: calc(var(--th) / -2); width: var(--th); transform: rotateY(90deg); }
.edge--t { left: 7px; right: 7px; top: calc(var(--th) / -2); height: var(--th); transform: rotateX(90deg); }
.edge--b { left: 7px; right: 7px; bottom: calc(var(--th) / -2); height: var(--th); transform: rotateX(-90deg); }
.mat-flash { position: absolute; inset: -14px; border-radius: 16px; pointer-events: none; opacity: 0; background: radial-gradient(closest-side, rgba(255, 255, 255, .95), rgba(225, 230, 255, .55) 55%, transparent); }

/* holo sheen: its position follows the rotation angle (paused Web Animation) — visible only while moving */
.holo { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity var(--t-med) var(--ease); }
.card-wrap.is-3d .holo { opacity: 1; }
.holo i { position: absolute; top: -25%; bottom: -25%; left: -60%; width: 220%;
  background: linear-gradient(105deg, transparent 32%, rgba(160, 225, 255, .28) 42%, rgba(255, 244, 205, .5) 49%, rgba(255, 175, 228, .3) 56%, rgba(190, 170, 255, .2) 61%, transparent 70%); }

/* light motes around the card (always on, colour = level) */
.motes-spread { position: absolute; inset: 0; pointer-events: none; transition: transform 500ms var(--ease), opacity 400ms var(--ease); }
.fore.is-busy .motes-spread { transform: scale(1.22); }
.motes-swirl { position: absolute; inset: 0; animation: mote-swirl 5s linear infinite paused; }
.fore.is-busy .motes-swirl { animation-play-state: running; }   /* motes swirl around the card only while it turns (runs on the GPU) */
.fore.is-busy.is-ccw .motes-swirl { animation-direction: reverse; }
@keyframes mote-swirl { to { transform: rotate(360deg); } }
.mote { position: absolute; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px 2px var(--c, #ecc768), 0 0 14px 3px color-mix(in srgb, var(--c, #ecc768) 45%, transparent); opacity: 0; }
.mote.sm { width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; }

/* Game card (same build as css/fx.css "Gilded Nocturne") */
.card { --rc: var(--r-normal); --rc2: var(--r-normal-2); --orn: var(--rc); position: absolute; inset: 0; border-radius: var(--r-card); user-select: none; -webkit-user-select: none; }
.card__frame { position: absolute; inset: 0; border-radius: var(--r-card); overflow: hidden; background: var(--rc2); box-shadow: 0 1px 0 rgba(255, 240, 200, .25) inset, 0 14px 34px rgba(0, 0, 0, .6); }
.card__frame::before { content: ""; position: absolute; left: 50%; top: 50%; width: 220%; aspect-ratio: 1; transform: translate(-50%, -50%) rotate(0deg); background: linear-gradient(135deg, var(--rc), var(--rc2) 30%, var(--rc) 50%, var(--rc2) 70%, var(--rc)); }
.card__body { position: absolute; inset: 5px; border-radius: 4px; overflow: hidden; background: #0d1020; box-shadow: 0 0 0 1px rgba(0, 0, 0, .7); }
.card__body::after { content: ""; position: absolute; inset: 3px; z-index: 2; pointer-events: none; border: 1px solid color-mix(in srgb, var(--rc) 55%, transparent); border-radius: 2px; }
.card__art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.card__orn { position: absolute; inset: 4px; z-index: 2; pointer-events: none; background: var(--orn); opacity: .95;
  -webkit-mask: var(--orn-tl) top left / var(--orn-s) no-repeat, var(--orn-tr) top right / var(--orn-s) no-repeat, var(--orn-bl) bottom left / var(--orn-s) no-repeat, var(--orn-br) bottom right / var(--orn-s) no-repeat;
          mask: var(--orn-tl) top left / var(--orn-s) no-repeat, var(--orn-tr) top right / var(--orn-s) no-repeat, var(--orn-bl) bottom left / var(--orn-s) no-repeat, var(--orn-br) bottom right / var(--orn-s) no-repeat; }
.card__info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 34px 10px 11px; text-align: center; background: linear-gradient(180deg, transparent, rgba(8, 10, 22, .92) 42%); }
.card__name { font-family: var(--font-display); font-weight: 700; font-size: calc(var(--cw) * .066); letter-spacing: .04em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card__name::after { content: ""; display: block; height: 1px; margin: 4px auto 0; width: 70%; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--rc) 80%, transparent), transparent); }
.card__series { margin-top: 3px; font-size: 10.5px; color: var(--ink-dim); font-style: italic; }
.card__stats { display: flex; justify-content: center; gap: 12px; margin-top: 5px; font-family: var(--font-display); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.card__stats b { color: var(--ink-faint); font-weight: 600; margin-right: 3px; font-size: 10px; }
.card__stat--atk { color: var(--atk); } .card__stat--hp { color: var(--hp); }
.card__tag { position: absolute; z-index: 3; left: 10px; top: 10px; padding: 1px 8px 1px 7px; font-family: var(--font-display); font-size: 9.5px; font-weight: 700; letter-spacing: .08em; color: #1a1408; background: var(--rc); clip-path: polygon(0 0, 100% 0, calc(100% - 5px) 50%, 100% 100%, 0 100%); }
.card__tier { position: absolute; z-index: 3; right: 8px; top: 8px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%;
  font-family: var(--font-display); font-size: 12px; font-weight: 700; color: #fff6e6; text-shadow: 0 1px 0 rgba(0, 0, 0, .45);
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--tc) 70%, #fff), var(--tc) 45%, color-mix(in srgb, var(--tc) 55%, #000));
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--tc) 60%, #000), 0 2px 6px rgba(0, 0, 0, .6); }
.card__tier::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, .35); }
.card__flash { position: absolute; inset: 0; z-index: 2; background: radial-gradient(circle at 50% 40%, #fff, var(--rc) 70%); opacity: 0; pointer-events: none; border-radius: var(--r-card); }
.card__halo, .card__sweep, .card__stars, .card__particles { position: absolute; pointer-events: none; opacity: 0; }
.card__halo { inset: -7px; border-radius: calc(var(--r-card) + 6px); z-index: -1; }
.card__sweep { z-index: 2; top: -10%; bottom: -10%; left: 0; width: 38%; background: linear-gradient(90deg, transparent, rgba(255, 238, 190, .5), transparent); transform: translateX(-130%) skewX(-18deg); }
.card__stars { inset: 0; z-index: 1; background-image: radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 78% 12%, #dcd4ff, transparent), radial-gradient(1.4px 1.4px at 64% 40%, #fff, transparent), radial-gradient(1px 1px at 24% 58%, #cfc4ff, transparent), radial-gradient(1.2px 1.2px at 88% 30%, #fff, transparent), radial-gradient(1px 1px at 40% 28%, #fff, transparent); }
.card__particles { inset: 0; overflow: visible; z-index: 3; }
.card__particles i { position: absolute; bottom: 10%; width: 4px; height: 4px; border-radius: 50%; background: #fffaf0; box-shadow: 0 0 6px #ffe6b0; opacity: 0; }
.card__particles i:nth-child(1) { left: 12%; animation-delay: 0s; }
.card__particles i:nth-child(2) { left: 30%; animation-delay: .9s; background: #f5c9e4; }
.card__particles i:nth-child(3) { left: 50%; animation-delay: 1.8s; }
.card__particles i:nth-child(4) { left: 68%; animation-delay: .4s; background: #fff0b0; }
.card__particles i:nth-child(5) { left: 86%; animation-delay: 1.3s; background: #cdb8f5; }
@keyframes fx-spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes fx-sweep { 0%, 55% { transform: translateX(-130%) skewX(-18deg); } 100% { transform: translateX(230%) skewX(-18deg); } }
@keyframes fx-pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
@keyframes fx-halo { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.045); } }
@keyframes fx-twinkle { 0%, 100% { opacity: .3; } 50% { opacity: .95; } }
@keyframes fx-float { from { opacity: 0; transform: translateY(0) scale(.6); } 20% { opacity: 1; } to { opacity: 0; transform: translateY(-140px) scale(1); } }
.card[data-rarity="Shiny"] { --rc: var(--r-shiny); --rc2: var(--r-shiny-2); }
.card[data-rarity="Shiny"] .card__frame { box-shadow: 0 0 18px rgba(236, 199, 104, .35), 0 14px 34px rgba(0, 0, 0, .6); }
.card[data-rarity="Shiny"] .card__sweep { opacity: 1; }
.card[data-rarity="Shiny"].is-live .card__sweep { animation: fx-sweep 3.2s var(--ease) infinite; }
.card[data-rarity="Rainbow"] { --rc: #f0b6d0; --rc2: #2a1840; --orn: #fff1e0; }
.card[data-rarity="Rainbow"] .card__frame::before { background: var(--r-rainbow); }
.card[data-rarity="Rainbow"].is-live .card__frame::before { animation: fx-spin 5s linear infinite; }
.card[data-rarity="Rainbow"] .card__frame { box-shadow: 0 0 20px rgba(200, 140, 220, .35), 0 14px 34px rgba(0, 0, 0, .6); }
.card[data-rarity="Rainbow"] .card__tag { background: linear-gradient(90deg, #e8607a, #e9a75a, #e8dc78, #7fd39a, #69b9e0, #8a7be0); }
.card[data-rarity="Secret"] { --rc: var(--r-secret); --rc2: var(--r-secret-2); --orn: #e0485e; }
.card[data-rarity="Secret"] .card__frame::before { background: linear-gradient(135deg, #e0485e, #120206 35%, #4a0c17 50%, #120206 65%, #e0485e); }
.card[data-rarity="Secret"] .card__halo { opacity: .45; box-shadow: 0 0 26px 6px rgba(201, 52, 75, .55); }
.card[data-rarity="Secret"].is-live .card__halo { animation: fx-pulse 2.4s ease-in-out infinite; }
.card[data-rarity="Secret"] .card__body { background: #14040a; }
.card[data-rarity="Secret"] .card__tag { color: #ffe9ec; background: #7b1424; }
.card[data-rarity="Divine"] { --rc: var(--r-divine); --rc2: var(--r-divine-2); --orn: #f2d488; }
.card[data-rarity="Divine"] .card__frame::before { background: linear-gradient(135deg, #fffdf4, #e2bd6c 50%, #fffdf4); }
.card[data-rarity="Divine"] .card__halo { opacity: .55; border: 2px solid rgba(255, 240, 205, .8); box-shadow: 0 0 22px rgba(255, 226, 160, .65), inset 0 0 14px rgba(255, 226, 160, .45); }
.card[data-rarity="Divine"].is-live .card__halo { animation: fx-halo 3s ease-in-out infinite; }
.card[data-rarity="Cosmic"] { --rc: #a796ff; --rc2: #14184a; --orn: #c9c0ff; }
.card[data-rarity="Cosmic"] .card__frame::before { background: conic-gradient(from 0deg, var(--r-cosmic), var(--r-cosmic-2), #14184a, var(--r-cosmic)); }
.card[data-rarity="Cosmic"].is-live .card__frame::before { animation: fx-spin 9s linear infinite; }
.card[data-rarity="Cosmic"] .card__frame { box-shadow: 0 0 22px rgba(120, 100, 255, .4), 0 14px 34px rgba(0, 0, 0, .6); }
.card[data-rarity="Cosmic"] .card__stars { opacity: .3; }
.card[data-rarity="Cosmic"].is-live .card__stars { animation: fx-twinkle 2.6s ease-in-out infinite; }
.card[data-rarity="Ascended"] { --rc: #f4ecff; --rc2: #2b2050; --orn: #fffaf0; }
.card[data-rarity="Ascended"] .card__frame::before { background: var(--r-ascended); }
.card[data-rarity="Ascended"].is-live .card__frame::before { animation: fx-spin 3.5s linear infinite; }
.card[data-rarity="Ascended"] .card__frame { box-shadow: 0 0 26px rgba(220, 210, 255, .5), 0 14px 34px rgba(0, 0, 0, .6); }
.card[data-rarity="Ascended"] .card__tag { background: linear-gradient(90deg, #a9eef5, #c5a8f5, #f5b4dc, #f8e7a8); }
.card[data-rarity="Ascended"] .card__particles { opacity: 1; }
.card[data-rarity="Ascended"].is-live .card__particles i { animation: fx-float 2.8s ease-out infinite; }
html.lite .card__particles i:nth-child(2n) { display: none; }

/* ---------------- Callouts (lines end at their own label; never cross text or buttons) ---------------- */
.callouts { position: absolute; inset: 0; pointer-events: none; transition: opacity var(--t-med) var(--ease); }
.fore.is-busy .callouts { opacity: .14; }
.fore.is-zoom .callouts, .fore:not(.is-ready) .callouts { opacity: 0; }
.fore.is-zoom .callouts *, .fore:not(.is-ready) .callouts * { pointer-events: none !important; }
.fore.is-zoom .co-pop { display: none; }
.seg { position: absolute; height: 1.5px; transform-origin: 0 50%; }
.seg i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0);
  background: linear-gradient(90deg, color-mix(in srgb, var(--lvl) 85%, #fff), rgba(235, 240, 255, .9));
  box-shadow: 0 0 6px color-mix(in srgb, var(--lvl) 70%, transparent); border-radius: 2px; }
.dot { position: absolute; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%;
  background: radial-gradient(circle, #fff 0 28%, color-mix(in srgb, var(--lvl) 90%, #fff) 32% 48%, transparent 52%);
  box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--lvl) 80%, transparent), 0 0 10px color-mix(in srgb, var(--lvl) 80%, transparent); transform: scale(0); }
.dot--end { width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; background: color-mix(in srgb, var(--lvl) 80%, #fff); box-shadow: 0 0 6px var(--lvl); }
.co { position: absolute; display: block; min-height: 44px; padding: 4px 6px; border-radius: 6px; text-align: left; pointer-events: auto; opacity: 0; transform: translateY(6px); transition: background-color var(--t-fast) var(--ease); }
.co:active { background: rgba(255, 255, 255, .06); }
.co[aria-expanded="true"] { background: rgba(10, 14, 40, .55); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--lvl) 45%, transparent); }
.co__k { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 700; font-size: 10.5px; letter-spacing: .16em; color: color-mix(in srgb, var(--lvl) 75%, #fff); text-shadow: 0 1px 6px rgba(0, 0, 30, .9); text-transform: uppercase; }
.co__k::before { content: ""; width: 6px; height: 6px; transform: rotate(45deg); background: currentColor; flex: none; }
.co__k::after { content: "+"; margin-left: 2px; font-family: var(--font-body); font-size: 13px; letter-spacing: 0; opacity: .75; }
.co[aria-expanded="true"] .co__k::after { content: "–"; }
.co__n { margin-top: 1px; font-family: var(--font-display); font-weight: 700; font-size: 13.5px; color: var(--ink); text-shadow: 0 1px 8px rgba(0, 0, 30, .95); line-height: 1.2; }
.co__d { margin-top: 2px; font-size: 11.5px; line-height: 1.35; color: #d9d6e8; text-shadow: 0 1px 6px rgba(0, 0, 30, 1), 0 0 2px rgba(0, 0, 30, .8); }
.co--good .co__d b { color: var(--good); font-weight: 600; }
.co--bad .co__k { color: #ff9aa8; }
.co--bad .co__d b { color: var(--bad); font-weight: 600; }
.co.is-r { text-align: right; } .co.is-r .co__k { justify-content: flex-end; }
/* expanded explanation */
.co-pop { position: absolute; z-index: 3; padding: 12px 14px 13px; border-radius: var(--r-panel); pointer-events: auto;
  background: var(--panel-fill); box-shadow: 0 0 0 1px color-mix(in srgb, var(--lvl) 45%, transparent), 0 16px 34px rgba(0, 0, 0, .6);
  font-size: 13px; line-height: 1.5; color: var(--ink); opacity: 0; transform: translateY(var(--py, 6px)) scale(.97); transition: opacity 200ms var(--ease), transform 200ms var(--ease); }
.co-pop.is-on { opacity: 1; transform: none; }
.co-pop[hidden] { display: none; }

/* ---------------- Overall ring + Details button (under the card) ---------------- */
.ovr, .dbtn { position: absolute; left: 0; top: 0; pointer-events: auto; opacity: 0; transition: opacity var(--t-slow) var(--ease); }
.fore.is-ready .ovr, .fore.is-ready .dbtn { opacity: 1; }
.fore.is-zoom .ovr, .fore.is-zoom .dbtn { opacity: 0; pointer-events: none; }
.ovr { width: 60px; height: 60px; pointer-events: none; }
.ovr svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ovr__bg { fill: rgba(8, 10, 30, .72); stroke: rgba(216, 180, 106, .18); stroke-width: 5; }
.ovr__arc { fill: none; stroke: url(#ovrGrad); stroke-width: 5; stroke-linecap: round; transition: opacity 320ms var(--ease); }
.ovr b { position: absolute; left: 0; right: 0; top: 15px; text-align: center; font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--gold-hi); font-variant-numeric: tabular-nums; line-height: 1; }

.dbtn { position: absolute; height: 40px; padding: 0 16px; border-radius: var(--r-chip); display: inline-flex; align-items: center; gap: 6px;

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding: 6px 12px calc(8px + var(--safe-b)); background: linear-gradient(0deg, rgba(5, 8, 30, .88) 35%, rgba(5, 8, 30, 0)); }

.lv button[aria-pressed="true"] i { transform: scale(1.25); }
.lv button:active i { transform: scale(.96); }
.lv__ind { position: absolute; left: 0; top: 0; width: 40px; height: 40px; pointer-events: none; transition: transform var(--t-med) var(--ease); }
.lv__ind::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1.5px solid var(--gold-hi); box-shadow: 0 0 12px rgba(243, 220, 160, .55); }

  margin: 0; padding: 6px 12px; border-radius: 999px; background: rgba(6, 9, 32, .78); box-shadow: inset 0 0 0 1px rgba(216, 180, 106, .3);
  font-size: 11.5px; color: var(--ink-dim); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 600ms var(--ease); }

.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(2, 4, 18, .62); }
.scrim[hidden] { display: none; }
.sheet:not(.is-open) { transform: translateY(calc(100% + 24px)); visibility: hidden; }
.sheet.is-ready-paint { visibility: visible; }
.sheet { position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: min(84dvh, 720px);
  display: flex; flex-direction: column; border-radius: 16px 16px 0 0; background: var(--panel-fill);

.sheet__row { display: flex; align-items: center; gap: 12px; }
.sheet__thumb { flex: none; width: 44px; height: 62px; border-radius: 5px; overflow: hidden; box-shadow: 0 0 0 2px var(--lvl); }
.sheet__thumb svg { width: 100%; height: 100%; display: block; }
.sheet__title { flex: 1; min-width: 0; }
.sheet__title h2 { margin: 0; font-family: var(--font-display); font-size: 18px; letter-spacing: .04em; }
.sheet__title p { margin: 2px 0 0; font-size: 12px; color: var(--ink-dim); }
.sheet__x { flex: none; width: 40px; height: 40px; border-radius: var(--r-chip); display: grid; place-items: center; color: var(--gold-hi); box-shadow: inset 0 0 0 1px rgba(216, 180, 106, .4); position: relative; }
.sheet__body { flex: 1; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 14px 16px calc(18px + var(--safe-b)); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.stats div { padding: 8px 6px; border-radius: 6px; text-align: center; background: rgba(5, 8, 30, .55); box-shadow: inset 0 0 0 1px rgba(216, 180, 106, .22); }
.stats dt { font-size: 9.5px; letter-spacing: .12em; color: var(--ink-faint); text-transform: uppercase; }
.stats dd { margin: 2px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }

.sec li { display: flex; gap: 8px; }
.sec--good li::before { content: "✓"; color: var(--good); font-weight: 700; }
.sec--bad h3 { color: #ff9aa8; }
.sec--bad li::before { content: "✕"; color: var(--bad); font-weight: 700; }

.fps { position: fixed; z-index: 9; left: 8px; top: calc(var(--top-h) + 4px); padding: 2px 6px; border-radius: 4px; font: 600 11px var(--font-body); background: rgba(0, 0, 0, .6); color: #9f9; }

@media (prefers-reduced-motion: reduce) {

</style>
</head>
<body>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // lite mode (§11.2 item 6): low RAM / few cores → half the dust and sparkles, lower canvas resolution
  let lite = false;
  try { lite = (navigator.deviceMemory && navigator.deviceMemory <= 4) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4); } catch (e) {}
  if (qs.has('lite')) lite = true;
  if (qs.has('full')) lite = false;
  if (lite) { document.documentElement.classList.add('lite'); $('liteTag').hidden = false; }

  /* ---------- seeded random (same painting every load) ---------- */
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- levels ---------- */
  const LEVELS = [
    { id: 'Normal',   pal: ['#eef1f8', '#c9cfdb', '#9aa3b8', '#ffffff'], sw: '#c9cfdb' },
    { id: 'Shiny',    pal: ['#fff0b0', '#ecc768', '#d9a63e', '#fff8dc'], sw: '#ecc768' },
    { id: 'Rainbow',  pal: ['#e8607a', '#e9a75a', '#e8dc78', '#7fd39a', '#69b9e0', '#8a7be0', '#d36cc0'], sw: 'conic-gradient(#e8607a,#e9a75a,#e8dc78,#7fd39a,#69b9e0,#8a7be0,#d36cc0,#e8607a)', byAngle: true },
    { id: 'Secret',   pal: ['#ff6a80', '#c9344b', '#8e1a2c', '#ffb0bb'], sw: '#c9344b' },
    { id: 'Divine',   pal: ['#ffffff', '#fff4d8', '#f2d488', '#fffbe9'], sw: '#fff4d8' },
    { id: 'Cosmic',   pal: ['#b3a6ff', '#8f7dff', '#5ac8ff', '#dcd4ff'], sw: '#8f7dff' },
    { id: 'Ascended', pal: ['#fffaf0', '#a9eef5', '#c5a8f5', '#f5b4dc', '#f8e7a8', '#b4f0d2'], sw: 'conic-gradient(#fffaf0,#a9eef5,#c5a8f5,#f5b4dc,#f8e7a8,#b4f0d2,#fffaf0)', byAngle: true },
  ];
  let level = LEVELS[1];

  /* ---------- geometry of the painting ---------- */
  const sky = $('sky');
  let G = null;            // { W, H, sx, sy, R, wings:[], roots:[], trunk:[] }
  function geometry() {
    const W = sky.clientWidth, H = sky.clientHeight;
    const portrait = H >= W;
    const sx = W / 2;
    const sy = portrait ? clamp(H * 0.108, 84, 150) : clamp(H * 0.135, 84, 170);   // sky starts 26px above the screen
    const R = clamp(Math.min(W, H * 0.55) * (portrait ? 0.118 : 0.15), 34, 84);
    const r = rng(20261024);
    const wings = [], roots = [], trunk = [];
    // wings: a fan of feather "hairs" on both sides, from just above the horizon to steeply up; tips droop
    const nW = lite ? 340 : 560, reach = Math.max(W * 0.62, R * 5.2);
    for (let i = 0; i < nW; i++) {
      const side = i % 2 ? 1 : -1;
      // δ > 0 = upward. Right wing angle = -δ, left wing = π + δ (mirror)
      const d0 = -0.5 + Math.pow(r(), 0.8) * 1.85;
      const a0 = side > 0 ? -d0 : Math.PI + d0;
      const rad = R * (0.92 + Math.pow(r(), 2) * 0.7);
      const px = sx + Math.cos(a0) * rad, py = sy + Math.sin(a0) * rad;
      const len = (0.3 + Math.pow(r(), 0.7) * 0.8) * reach * (1 - Math.max(0, d0 - 0.6) * 0.45);
      const d1 = d0 * (0.55 + r() * 0.25) + (r() - 0.5) * 0.15;   // leans toward the horizon
      let ang = side > 0 ? -d1 : Math.PI + d1;
      const curl = (0.4 + r() * 1.1) * (portrait ? 0.0085 : 0.0055) * side;   // tips droop downward (more on a tall phone screen)
      const wav = (r() - 0.5) * 0.05;
      const pts = [[px, py]]; let x = px, y = py; const steps = Math.max(10, len / 9 | 0);
      for (let s = 0; s < steps; s++) {
        ang += curl * (s / steps) * 10 + wav * Math.sin(s * 0.5) + (r() - 0.5) * 0.06;
        x += Math.cos(ang) * len / steps; y += Math.sin(ang) * len / steps; pts.push([x, y]);
      }
      wings.push({ pts, w: 0.35 + Math.pow(r(), 1.5) * 2.4, a: 0.18 + r() * 0.55, c: r(), d0 });
    }
    // roots: branching silver tendrils hanging below the sun
    const branch = (x, y, ang, len, w, depth) => {
      const pts = [[x, y]]; const steps = Math.max(6, len / 9 | 0);
      for (let s = 0; s < steps; s++) {

        x += Math.cos(ang) * len / steps; y += Math.sin(ang) * len / steps; pts.push([x, y]);
        if (depth > 0 && s > 2 && r() < 0.085) branch(x, y, ang + (r() < 0.5 ? -1 : 1) * (0.35 + r() * 0.6), len * (0.35 + r() * 0.3), w * 0.62, depth - 1);
      }
      roots.push({ pts, w, a: 0.25 + r() * 0.5, c: r() });
    };
    const nR = lite ? 10 : 15;
    for (let i = 0; i < nR; i++) {
      const a = Math.PI * (0.08 + 0.84 * (i + r() * 0.6) / nR);
      const out = (a - Math.PI / 2) * 1.5;  // spread outward
      branch(sx + Math.cos(a) * R, sy + Math.sin(a) * R, a + out * 0.35, (0.35 + r() * 0.45) * H * 0.75, 1.1 + r() * 1.6, lite ? 2 : 3);
    }
    // trunk: a falling stream of white lines from the sun down behind the card
    const nT = lite ? 30 : 46, tyEnd = H * (0.5 + r() * 0.04);
    for (let i = 0; i < nT; i++) {
      const a = Math.PI * (0.32 + 0.36 * r());
      const x0 = sx + Math.cos(a) * R * 0.95, y0 = sy + Math.sin(a) * R * 0.95;
      const x1 = sx + (r() - 0.5) * R * 0.6, y1 = tyEnd + (r() - 0.5) * H * 0.12;
      const pts = []; for (let s = 0; s <= 14; s++) { const t = s / 14; const pinch = Math.sin(t * Math.PI) * 0.75; pts.push([lerp(x0, x1, t) + (sx - lerp(x0, x1, t)) * pinch * 0.6 + (r() - 0.5) * 1.5, lerp(y0, y1, t)]); }

    }
    return { W, H, sx, sy, R, CH: Math.ceil(sy + R * 1.9), wings, roots, trunk };

  function strokePoly(ctx, pts) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) { const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2; ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my); }

  // tapering stroke = the same polyline drawn 3 times, shorter and thinner each time (painterly, still cheap)
  function taper(ctx, line, color, scale) {
    const n = line.pts.length;
    ctx.strokeStyle = color;
    ctx.globalAlpha = line.a * 0.55; ctx.lineWidth = line.w * scale; strokePoly(ctx, line.pts);
    ctx.globalAlpha = line.a * 0.8; ctx.lineWidth = line.w * scale * 1.5; strokePoly(ctx, line.pts.slice(0, Math.max(2, n * 0.55 | 0)));

  const pick = (arr, t) => arr[Math.min(arr.length - 1, (t * arr.length) | 0)];

  // draw on a canvas ONCE, then hand the pixels to an <img>. A static <img> costs nothing per frame;
  // a big <canvas> layer is re-sent on every frame where something moves (measured: drag 32 → 60 fps).
  function bake(cv, type, q) {

  function sizeCanvas(cv, w, h, dpr) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); return c; }

  /* ---------- 1. the painting (drawn ONCE per width) ---------- */
  function paint() {
    const { W, H, sx, sy, R } = G;
    const dpr = Math.min(devicePixelRatio || 1, lite ? 1.25 : 2);
    const cv = document.createElement('canvas');
    const ctx = sizeCanvas(cv, W, H, dpr);
    const r = rng(7);
    // base: deep ultramarine, brighter around the sun
    let g = ctx.createRadialGradient(sx, sy + H * 0.18, 10, sx, sy + H * 0.2, Math.max(W, H) * 0.85);
    g.addColorStop(0, '#2449d6'); g.addColorStop(0.35, '#1533a8'); g.addColorStop(0.7, '#0b1f78'); g.addColorStop(1, '#060f45');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // brush daubs (painted texture)
    const daub = ['#2d5cf0', '#1a3cc0', '#0f2a96', '#4a72ff', '#0a1d74', '#6a8cff', '#1c2a8a', '#3a2f9e'];
    const nD = lite ? 420 : 760;
    for (let i = 0; i < nD; i++) {
      ctx.globalAlpha = 0.035 + r() * 0.09; ctx.fillStyle = pick(daub, r());
      ctx.beginPath(); ctx.ellipse(r() * W, r() * H, 14 + r() * 70, 3 + r() * 12, (r() - 0.5) * 1.2, 0, Math.PI * 2); ctx.fill();
    }
    // faint swirls
    ctx.lineWidth = 1.4; ctx.strokeStyle = '#7d9bff';
    for (let i = 0; i < 9; i++) {
      const cx = r() * W, cy = H * (0.2 + r() * 0.55), rr = 10 + r() * 22; ctx.globalAlpha = 0.07 + r() * 0.08;
      ctx.beginPath(); for (let t = 0; t < 14; t += 0.2) { const rad = rr * t / 14; ctx.lineTo(cx + Math.cos(t) * rad, cy + Math.sin(t) * rad); } ctx.stroke();
    }
    // mosaic squares (the pixel motif)
    for (let i = 0; i < (lite ? 40 : 70); i++) {
      const side = r() < 0.5 ? r() * W * 0.32 : W - r() * W * 0.32, y = H * (0.18 + r() * 0.6), s = 5 + r() * 18;
      ctx.globalAlpha = 0.06 + r() * 0.14;
      if (r() < 0.5) { ctx.fillStyle = r() < 0.5 ? '#5f86ff' : '#2a4bd0'; ctx.fillRect(side, y, s, s); }
      else { ctx.strokeStyle = '#8fb0ff'; ctx.lineWidth = 1.2; ctx.strokeRect(side, y, s, s); }
    }

    g = ctx.createLinearGradient(0, H * 0.6, 0, H); g.addColorStop(0, 'rgba(20,24,90,0)'); g.addColorStop(0.55, 'rgba(14,16,60,.55)'); g.addColorStop(1, 'rgba(8,10,40,.85)');
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, H * 0.6, W, H * 0.4);
    // roots, trunk, wings
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // roots: a wide faint glow pass, then the thin bright line (reads as glowing paint, not scratches)
    for (const l of G.roots) { const c = pick(['#6f8cff', '#86a2ff', '#a9bcff', '#5ea8ff'], l.c); ctx.globalAlpha = l.a * 0.22; ctx.strokeStyle = c; ctx.lineWidth = l.w * 3.2; strokePoly(ctx, l.pts); }
    for (const l of G.roots) taper(ctx, l, pick(['#9fb4ff', '#c4d0ff', '#e3e8ff', '#8fd0ff'], l.c), 0.7);
    for (const l of G.trunk) taper(ctx, l, pick(SILVER, l.c * 0.6), 0.9);
    // wing volume: soft white masses along the wing directions (painted body under the hairs)
    // (v2: thicker wings like the clip) two big white masses hugging the sun, then many soft lobes along the feathers
    for (const side of [-1, 1]) {
      ctx.save(); ctx.translate(sx + side * R * 1.9, sy - R * 0.25); ctx.rotate(side * -0.22); ctx.scale(1, 0.42);
      const gm = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 2.4); gm.addColorStop(0, 'rgba(240,240,255,.42)'); gm.addColorStop(0.55, 'rgba(225,222,255,.18)'); gm.addColorStop(1, 'rgba(220,220,255,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = gm; ctx.beginPath(); ctx.arc(0, 0, R * 2.4, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    for (let i = 0; i < (lite ? 50 : 90); i++) {
      const l = G.wings[(r() * G.wings.length) | 0], p = l.pts[(Math.pow(r(), 1.5) * l.pts.length * 0.7) | 0], q = l.pts[Math.min(l.pts.length - 1, ((Math.pow(r(), 1.5) * l.pts.length * 0.7) | 0) + 3)];
      const rx = R * (0.6 + r() * 1.5), ang = Math.atan2(q[1] - p[1], q[0] - p[0]);
      ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(ang); ctx.scale(1, 0.26 + r() * 0.2);
      const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, rx); gg.addColorStop(0, r() < 0.5 ? 'rgba(238,238,255,.3)' : 'rgba(212,202,255,.26)'); gg.addColorStop(1, 'rgba(220,220,255,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    const WING = ['#ffffff', '#f1f2ff', '#e2e3ff', '#d6d0ff', '#c4cdff', '#b9b0f0', '#a9bdff'];
    for (const l of G.wings) {
      const col = pick(WING, l.c);
      taper(ctx, l, col, 1);
      if (l.c < 0.4) {   // feather bundles: 2 faint copies beside the hair → a thicker painted stroke
        for (const o of [-1.8, 1.8]) { ctx.save(); ctx.translate(0, o); const a = l.a; l.a = a * 0.45; taper(ctx, l, col, 0.8); l.a = a; ctx.restore(); }

    ctx.globalAlpha = 1; g = ctx.createRadialGradient(sx - R * 0.2, sy - R * 0.25, R * 0.1, sx, sy, R);

    ctx.save(); ctx.beginPath(); ctx.arc(sx, sy, R * 0.98, 0, Math.PI * 2); ctx.clip();
    for (let i = 0; i < 46; i++) { // swirling dark texture inside the disc
      const rad = R * (0.15 + r() * 0.8), a0 = r() * Math.PI * 2;
      ctx.globalAlpha = 0.18 + r() * 0.3; ctx.strokeStyle = r() < 0.5 ? '#2c2d3c' : '#3a3b4e'; ctx.lineWidth = 0.6 + r() * 1.6;
      ctx.beginPath(); ctx.arc(sx + (r() - 0.5) * R * 0.2, sy + (r() - 0.5) * R * 0.2, rad, a0, a0 + 0.6 + r() * 1.6); ctx.stroke();
    }
    ctx.restore();
    // static fog base + vignette
    g = ctx.createLinearGradient(0, H * 0.72, 0, H); g.addColorStop(0, 'rgba(150,145,215,0)'); g.addColorStop(1, 'rgba(170,165,225,.42)');
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, H * 0.72, W, H * 0.28);
    g = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.45, Math.max(W, H) * 0.8);
    g.addColorStop(0, 'rgba(0,0,20,0)'); g.addColorStop(1, 'rgba(0,0,20,.55)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  }

  /* ---------- tendril mask for the running light (drawn once, half resolution) ---------- */
  let maskURL = null;
  function makeMask() {
    const pulse = $('pulse');
    const supports = CSS.supports('mask-image', 'url(a.png)') || CSS.supports('-webkit-mask-image', 'url(a.png)');
    if (!supports || reduce) { pulse.hidden = true; return; }
    const { W, H, sx, sy, R } = G;
    const cv = document.createElement('canvas');
    const ctx = sizeCanvas(cv, W, H, 0.5);
    ctx.lineCap = 'round'; ctx.strokeStyle = '#fff';
    for (const l of G.roots) taper(ctx, l, '#fff', 1.6);
    for (const l of G.trunk) taper(ctx, l, '#fff', 1.4);
    for (const l of G.wings) taper(ctx, l, '#fff', 1.5);
    ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(sx, sy, R * 0.98, 0, Math.PI * 2); ctx.fill();

      if (!b) return;
      if (maskURL) URL.revokeObjectURL(maskURL);
      maskURL = URL.createObjectURL(b);
      pulse.style.webkitMaskImage = pulse.style.maskImage = `url(${maskURL})`;
      pulse.style.setProperty('--sx', sx + 'px'); pulse.style.setProperty('--sy', sy + 'px');
      pulse.style.setProperty('--pr', Math.round(Math.hypot(Math.max(sx, W - sx), H - sy) * 2.1) + 'px');
      requestAnimationFrame(() => pulse.classList.add('is-on'));
    });
  }

  /* ---------- sun ring + gold flecks (re-drawn only when the level changes) ---------- */
  // only the top strip of the sky (ring + flecks) is drawn, once per level, then kept as an image
  let coronaFront = $('coronaA'), coronaBack = $('coronaB'), coronaTok = 0;
  const coronaCache = new Map();
  function getCorona(lv) {
    if (!coronaCache.has(lv.id)) coronaCache.set(lv.id, drawCorona(lv));
    return coronaCache.get(lv.id);
  }
  function clearCoronaCache() { for (const pr of coronaCache.values()) pr.then((u) => u && URL.revokeObjectURL(u)); coronaCache.clear(); }
  function drawCorona(lv) {
    const { W, sx, sy, R, CH } = G;
    const dpr = Math.min(devicePixelRatio || 1, lite ? 1.25 : 2);
    const cv = document.createElement('canvas');
    const ctx = sizeCanvas(cv, W, CH, dpr);
    const r = rng(99);
    const col = (ang, t) => lv.byAngle ? lv.pal[Math.floor(((ang / (Math.PI * 2)) % 1 + 1) % 1 * lv.pal.length)] : pick(lv.pal, t);
    ctx.lineCap = 'round';
    // soft glow ring
    const main = lv.byAngle ? '#ffffff' : lv.pal[1];
    let g = ctx.createRadialGradient(sx, sy, R * 0.92, sx, sy, R * 1.75);
    g.addColorStop(0, main); g.addColorStop(0.2, main + '88'); g.addColorStop(1, main + '00');
    ctx.globalAlpha = 0.55; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, R * 1.75, 0, Math.PI * 2); ctx.arc(sx, sy, R * 0.95, 0, Math.PI * 2, true); ctx.fill();

      const a = r() * Math.PI * 2, len = 0.15 + r() * 0.5, rad = R * (1.0 + r() * 0.17);
      ctx.globalAlpha = 0.35 + r() * 0.65; ctx.strokeStyle = col(a, r()); ctx.lineWidth = 0.8 + r() * 3.4;
      ctx.beginPath(); ctx.arc(sx, sy, rad, a, a + len); ctx.stroke();

    ctx.globalAlpha = 0.9; ctx.strokeStyle = lv.byAngle ? '#fff' : lv.pal[0]; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(sx, sy, R * 1.0, 0, Math.PI * 2); ctx.stroke();

    const n = lite ? 240 : 420;
    const upper = G.wings.filter((l) => l.d0 > -0.15);   // flecks live in the upper feathers, like the clip
    for (let i = 0; i < n; i++) {
      const l = upper[(r() * upper.length) | 0];
      const t = Math.pow(r(), 2.3) * 0.6;
      const k = Math.min(l.pts.length - 2, (t * l.pts.length) | 0);
      const p = l.pts[k], q = l.pts[k + 1];
      if (p[1] > sy + R * 0.35) continue;
      const ang = Math.atan2(q[1] - p[1], q[0] - p[0]);
      const len = r() < 0.4 ? 0.6 : 1.5 + r() * 4.5, x = p[0] + (r() - 0.5) * 6, y = p[1] + (r() - 0.5) * 6;

    }
    ctx.globalAlpha = 1;
    return bake(cv, 'image/png');
  }
  function showLevelCorona(lv, instant) {
    const tok = ++coronaTok;
    return getCorona(lv).then((url) => {
      if (tok !== coronaTok) return;
      const img = coronaBack; img.style.height = G.CH + 'px';
      return setImg(img, url).then(() => {
        if (tok !== coronaTok) return;
        const old = coronaFront; coronaFront = img; coronaBack = old;
        if (instant) img.style.transition = 'none';
        img.classList.add('is-on'); old.classList.remove('is-on');
        if (instant) { void img.offsetWidth; img.style.transition = ''; }
      });
    });
  }
  // after the intro, bake the other 6 ring colours one at a time while the phone is idle → level buttons swap instantly
  function prebakeCoronas() {
    const todo = LEVELS.filter((lv) => !coronaCache.has(lv.id));
    const idle = window.requestIdleCallback || ((f) => setTimeout(f, 120));
    const next = () => { const lv = todo.shift(); if (!lv) return; getCorona(lv).then(() => idle(next, { timeout: 1500 })); };
    idle(next, { timeout: 1500 });
  }

  /* ---------- sparkles + fog (static DOM / canvas, CSS animates them) ---------- */
  function buildSparks() {
    const { W, H, sx, sy, R } = G, box = $('sparks'), r = rng(5);
    box.textContent = '';
    const n = lite ? 8 : 16, frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const el = document.createElement('i');
      const l = G.wings[(r() * G.wings.length) | 0], p = l.pts[(Math.pow(r(), 1.4) * l.pts.length * 0.8) | 0];
      const near = i < n * 0.65;
      const x = near ? p[0] : r() * W, y = near ? p[1] : H * (0.25 + r() * 0.45);
      if (r() < 0.45) el.className = 'sm';
      el.style.left = (x + 26) + 'px'; el.style.top = (y + 26) + 'px';
      el.style.animationDelay = (-r() * 3.4).toFixed(2) + 's'; el.style.animationDuration = (2.6 + r() * 2.2).toFixed(2) + 's';
      frag.appendChild(el);
    }
    box.appendChild(frag);
  }
  function buildFog() {
    const fog = $('fog'); fog.textContent = '';
    const w = innerWidth + 80, h = Math.round(innerHeight * 0.4);
    const cv = document.createElement('canvas');
    const ctx = sizeCanvas(cv, w, h, lite ? 0.5 : 0.75);   // fog is blurry anyway → low resolution is fine
    const r = rng(11);
    for (let i = 0; i < 26; i++) {
      const x = r() * w, y = h * (0.35 + r() * 0.7), rx = 60 + r() * 150, ry = 18 + r() * 40;
      for (const dx of [-w, 0, w]) {   // draw wrapped → seamless loop
        const g = ctx.createRadialGradient(x + dx, y, 0, x + dx, y, rx);
        g.addColorStop(0, `rgba(${185 + r() * 30 | 0},${180 + r() * 25 | 0},235,${0.16 + r() * 0.16})`); g.addColorStop(1, 'rgba(180,175,230,0)');

        ctx.beginPath(); ctx.arc(x + dx, y, rx, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
    }
    bake(cv, 'image/png').then((url) => {
      const old = fog.dataset.url; if (old) URL.revokeObjectURL(old);
      fog.dataset.url = url; fog.textContent = '';
      for (let k = 0; k < 2; k++) { const im = new Image(); im.alt = ''; im.src = url; fog.appendChild(im); }
    });
  }

  /* =====================================================================
     v2 — card, layout, interactions
     ===================================================================== */
  const fore = $('fore'), wrap = $('cardWrap'), zoomEl = $('zoom'), tiltEl = $('tilt'), rotor = $('rotor');
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  /* ---------- sample cards (all names and art are original) ---------- */
  const A_CAPE = 'M100 92 C86 96 80 108 76 124 C66 160 50 210 30 280 L170 280 C150 210 134 160 124 124 C120 108 114 96 100 92 Z';

    const stat = (k, v, col) => `<div><dt>${k}</dt><dd${col ? ` style="color:${col}"` : ''}>${esc(v)}</dd></div>`;
    const S = (t, x) => `<section class="sec"><h3>${t}</h3><h4>${esc(x.n)}</h4><p>${esc(x.full)}</p><p class="meta">${esc(x.meta)}</p></section>`;
    const Lst = (t, x, cls) => `<section class="sec ${cls}"><h3>${t}</h3><h4>${esc(x.n)}</h4><ul>${x.list.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></section>`;
    $('sheetBody').innerHTML = `<dl class="stats">${stat('ATK', c.atk, 'var(--atk)')}${stat('HP', c.hp, 'var(--hp)')}${stat('Overall', c.overall, 'var(--gold-hi)')}${stat('Tier', c.tier)}${stat('Grade', c.grade)}${stat('Odds', c.odds)}</dl>
      ${S('Skill', c.skill)}${S('Passive', c.passive)}${Lst('Strongest', c.strong, 'sec--good')}${Lst('Weakness', c.weak, 'sec--bad')}`;
    $('sheetBody').scrollTop = 0;
  }
  function moveSheet(f0, f1, dur, easing, done) {
    shAnims.forEach((a) => a.cancel());
    const o = { duration: Math.max(90, dur * Math.max(0.35, Math.abs(f1 - f0))), easing, fill: 'forwards' };
    shAnims = reduce
      ? [sheet.animate([{ opacity: 1 - f0 }, { opacity: 1 - f1 }], o), scrim.animate([{ opacity: 1 - f0 }, { opacity: 1 - f1 }], o)]
      : [sheet.animate([{ transform: `translateY(${f2(f0 * 100)}%)` }, { transform: `translateY(${f2(f1 * 100)}%)` }], o), scrim.animate([{ opacity: 1 - f0 }, { opacity: 1 - f1 }], o)];
    if (done) shAnims[0].onfinish = done;
  }
  function openSheet() {
    if (sheetOpen || !wrap.classList.contains('is-in')) return;
    fillSheet(); $('sheetBody').scrollTop = 0; closePop(true); hideHint();
    sheet.inert = false; sheet.classList.add('is-open'); scrim.hidden = false; sheetOpen = true;
    moveSheet(1, 0, 320, 'cubic-bezier(.2,.8,.2,1)');
    $('sheetX').focus({ preventScroll: true });
  }
  function closeSheet(from) {
    if (!sheetOpen) return;
    sheetOpen = false;
    moveSheet(from || 0, 1, 260, 'cubic-bezier(.4,0,1,1)', () => { shAnims.forEach((a) => a.cancel()); shAnims = []; sheet.classList.remove('is-open'); sheet.inert = true; scrim.hidden = true; $('detailsBtn').focus({ preventScroll: true }); });
  }
  function setupSheet() {
    $('detailsBtn').addEventListener('click', (e) => { ring(e.currentTarget); openSheet(); });
    $('sheetX').addEventListener('click', () => closeSheet(0));
    scrim.addEventListener('click', () => closeSheet(0));
    const head = $('sheetHead');
    head.addEventListener('pointerdown', (e) => {
      if (!sheetOpen || e.target.closest('button')) return;
      try { head.setPointerCapture(e.pointerId); } catch (err) {}
      SD = { id: e.pointerId, y0: e.clientY, h: sheet.offsetHeight, s: [[e.clientY, performance.now()]], f: 0, anim: null };
    });
    head.addEventListener('pointermove', (e) => {
      if (!SD || e.pointerId !== SD.id) return;
      const f = clamp((e.clientY - SD.y0) / SD.h, 0, 1);
      if (!SD.anim && f > 0.004) {   // finger drives a paused animation (no style writes per frame)
        shAnims.forEach((a) => a.cancel()); shAnims = [];
        SD.anim = [sheet.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(100%)' }], { duration: 1000, fill: 'both' }),
                   scrim.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1000, fill: 'both' })];
        SD.anim.forEach((a) => a.pause());
      }
      if (SD.anim) SD.anim.forEach((a) => a.currentTime = f * 1000);
      SD.f = f; const now = performance.now(); SD.s.push([e.clientY, now]); while (SD.s.length > 2 && now - SD.s[0][1] > 90) SD.s.shift();
    });
    const end = (e) => {
      if (!SD || e.pointerId !== SD.id) return;
      const d = SD; SD = null; if (!d.anim) return;
      const a = d.s[0], b = d.s[d.s.length - 1], v = (b[0] - a[0]) / Math.max(1, b[1] - a[1]);
      d.anim.forEach((x) => x.cancel());
      if (d.f > 0.28 || v > 0.55) closeSheet(d.f);
      else moveSheet(d.f, 0, 260, 'cubic-bezier(.2,.8,.2,1)');
    };
    head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
  }

  /* ---------- first-time hint ---------- */
  let hintDone = false, hintShown = false;
  function showHint() { if (hintShown) return; hintShown = true; $('hint').classList.add('is-on'); setTimeout(hideHint, 5200); }
  function hideHint() { if (hintDone) return; hintDone = true; hintShown = true; $('hint').classList.remove('is-on'); }

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (sheetOpen) closeSheet(0); else if (openCo) closePop(); else if (fore.classList.contains('is-zoom')) toggleZoom(false); }
    else if (!sheetOpen && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.closest('input')) switchCard(e.key === 'ArrowRight' ? 1 : -1);
  });

  /* ---------- intro: dust → card (rAF only during the intro) ---------- */
  let introRaf = 0, introTimers = [], targetCache = null;
  function sampleTargets(cw, ch, want) {
    const s = 2, cv = document.createElement('canvas'); cv.width = Math.ceil(cw / s); cv.height = Math.ceil(ch / s);
    const ctx = cv.getContext('2d'); ctx.scale(cw / 200 / s, ch / 280 / s);
    ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
    ctx.lineWidth = 9; ctx.strokeRect(4.5, 4.5, 191, 271);
    card().dust(ctx);
    ctx.globalAlpha = 0.5; ctx.fillRect(10, 232, 180, 34);
    ctx.globalAlpha = 0.35; ctx.fillRect(10, 10, 180, 260);
    const d = ctx.getImageData(0, 0, cv.width, cv.height).data, pts = [], r = rng(77);
    for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) {
      const a = d[(y * cv.width + x) * 4 + 3] / 255;
      if (a > 0 && r() < a) pts.push([(x + r()) * s, (y + r()) * s]);
    }
    for (let i = pts.length - 1; i > 0; i--) { const j = (r() * (i + 1)) | 0; [pts[i], pts[j]] = [pts[j], pts[i]]; }
    return pts.slice(0, want);
  }
  function resetCardState() {
    cancelAnimationFrame(R3.raf); R3.raf = 0; R3.mode = 'rest'; R3.ang = R3.prev = R3.tx = R3.vel = R3.vtx = 0; apply3D(); exit3D();
    toggleZoom(false); closeSheet(0); clearTimeout(tapTimer); tapTimer = 0;
  }
  function runIntro() {
    cancelAnimationFrame(introRaf); introTimers.forEach(clearTimeout); introTimers = [];
    const dust = $('dust');
    resetCardState(); hideCallouts();
    fore.classList.remove('is-ready'); wrap.classList.remove('is-in'); motesPlay(false);
    const reveal = () => {
      wrap.classList.add('is-in'); fore.classList.add('is-ready'); motesPlay(true);
      setOverall(card().overall, true);
      introTimers.push(setTimeout(() => { showCallouts(); introTimers.push(setTimeout(showHint, 1100)); }, 380));
    };
    if (reduce) { reveal(); return; }
    const W = innerWidth, H = innerHeight, fr = fore.getBoundingClientRect(), cw = wrap.offsetWidth, ch = wrap.offsetHeight;
    const L = fr.left + wrap.offsetLeft, T = fr.top + wrap.offsetTop;
    const ctx = sizeCanvas(dust, W, H, 1);   // 1× on purpose: tiny dust squares look the same, the layer is 7× smaller
    dust.hidden = false; dust.classList.remove('is-out');
    const nT = lite ? 520 : 900, nS = lite ? 140 : 240;
    const key = card().id + cw + 'x' + ch + 'x' + nT;
    if (!targetCache || targetCache.key !== key) targetCache = { key, pts: sampleTargets(cw, ch, nT) };
    const targets = targetCache.pts;
    const r = rng((Math.random() * 1e9) | 0);
    const COLS = ['#ffffff', '#e9e6ff', '#c9c6f2', '#b7c3ff'];
    const buckets = COLS.map(() => []);
    const mk = (tx, ty, stray) => {
      const sx = -W * 0.35 + r() * W * 0.45, sy = H * (0.86 + r() * 0.3);
      const nxp = stray ? 0.5 : (tx - L) / cw, nyp = stray ? 0.5 : (ty - T) / ch;
      const delay = (nxp * 0.55 + (1 - nyp) * 0.45) * 820 + r() * 260 + (stray ? r() * 500 : 0);
      const dur = 950 + r() * 520;
      const mx = lerp(sx, tx, 0.55) + W * (0.1 + r() * 0.35), my = lerp(sy, ty, 0.5) + (r() - 0.3) * H * 0.18;
      return { sx, sy, mx, my, tx, ty, delay, dur, stray, size: 1.3 + r() * (stray ? 1.4 : 1.9), ph: r() * 6.28 };
    };
    targets.forEach((p) => buckets[(r() * 4) | 0].push(mk(L + p[0], T + p[1], false)));
    for (let i = 0; i < nS; i++) buckets[(r() * 4) | 0].push(mk(W * (0.7 + r() * 0.6), -H * (0.05 + r() * 0.3), true));
    const QA = [0.35, 0.68, 1], MAXN = Math.max(...buckets.map((b) => b.length));
    const PX = new Float32Array(MAXN), PY = new Float32Array(MAXN), PS = new Float32Array(MAXN), PQ = new Int8Array(MAXN);
    const t0 = performance.now(); let shown = false;
    const step = (now) => {
      const t = now - t0;
      ctx.clearRect(0, 0, W, H);
      for (let b = 0; b < 4; b++) {
        const arr = buckets[b];
        for (let i = 0; i < arr.length; i++) {
          const p = arr[i], k = (t - p.delay) / p.dur;
          PQ[i] = -1;
          if (k <= 0 || (k >= 1 && p.stray)) continue;
          let x, y, a;
          if (k >= 1) { x = p.tx; y = p.ty; a = 0.65 + 0.35 * Math.sin(t * 0.012 + p.ph); }
          else {
            const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, u = 1 - e;
            x = u * u * p.sx + 2 * u * e * p.mx + e * e * p.tx; y = u * u * p.sy + 2 * u * e * p.my + e * e * p.ty;
            a = p.stray ? Math.sin(k * Math.PI) * 0.8 : Math.min(1, k * 3);
          }
          if (a < 0.12) continue;
          PX[i] = x; PY[i] = y; PS[i] = p.size * (k < 1 ? 1.2 : 1); PQ[i] = a < 0.5 ? 0 : a < 0.84 ? 1 : 2;
        }
        ctx.fillStyle = COLS[b];
        for (let q = 0; q < 3; q++) {
          ctx.globalAlpha = QA[q]; ctx.beginPath();
          for (let i = 0; i < arr.length; i++) if (PQ[i] === q) { const s = PS[i]; ctx.rect(PX[i] - s / 2, PY[i] - s / 2, s, s); }
          ctx.fill();
        }
      }
      if (!shown && t > 1950) {
        shown = true;
        $('matFlash').animate([{ opacity: 0, transform: 'scale(.92)' }, { opacity: 0.9, offset: 0.25 }, { opacity: 0, transform: 'scale(1.08)' }], { duration: 560, easing: 'ease-out' });
        dust.classList.add('is-out');
        reveal();
      }
      if (t < 2650) introRaf = requestAnimationFrame(step);
      else { introRaf = 0; ctx.clearRect(0, 0, W, H); dust.hidden = true; dust.width = dust.height = 1; }
    };
    introRaf = requestAnimationFrame(step);
  }

  /* ---------- optional fps meter (?fps) ---------- */
  if (qs.has('fps')) {
    const el = $('fps'); el.hidden = false; let n = 0, t0 = performance.now();
    const t = (now) => { n++; if (now - t0 >= 1000) { el.textContent = n + ' fps'; n = 0; t0 = now; } requestAnimationFrame(t); };
    requestAnimationFrame(t);
  }

  /* ---------- boot ---------- */
  let lastW = 0, lastCW = 0, ready = Promise.resolve();
  function build() {
    G = geometry(); lastW = innerWidth;
    clearCoronaCache();
    ready = Promise.all([paint(), showLevelCorona(level, true)]);
    makeMask(); buildSparks(); buildFog();
    return ready;
  }
  buildDock(); renderFaces(); buildCallouts(); updateCalloutTexts();
  setupCard(); setupSwipe(); setupSheet();
  build(); setupParallax();
  layout(); buildMotes(); lastCW = wrap.offsetWidth;
  setLevel(level, true, true);
  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1200))]) : Promise.resolve();
  Promise.all([fontsReady, ready]).then(() => { layout(); setTimeout(runIntro, 350); setTimeout(prebakeCoronas, 3400); });
  $('replayBtn').addEventListener('click', (e) => { ring(e.currentTarget); runIntro(); });
  let rt = 0;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      layout();
      if (Math.abs(wrap.offsetWidth - lastCW) > 2) { lastCW = wrap.offsetWidth; buildMotes(); targetCache = null; }
      if (Math.abs(innerWidth - lastW) > 40) build();
    }, 160);
  });
})();
</script>
</body>
</html>
