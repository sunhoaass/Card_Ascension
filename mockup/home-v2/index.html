<meta charset="utf-8">
<title>Infinity Home Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=Anton&family=Russo+One&display=swap">
<style>
/* Card Battle Infinity — Home mockups (look round 0 · 2026-11-10 · PROGRESS ▶️ "🎨 แผนหน้าตาใหม่")
   Three different Home pages on the same data: A "Altar" (a drifting wall of every card) ·
   B "Gazette" (the update as a front page) · C "Lobby" (a game hub: the card wall in a frame + big menu plates).
   Layout concept: phone first, one column; from 1100px the site's left menu + a wide grid.
   Colours: every value below is copied from css/tokens.css ("Castle Night": night navy, never black). Nothing else sets a colour.
   Cards are pictures of the site's own cards (C.renderCard), not game files. The castle is the site's own FX.backdrop drawing. */
:root {
  color-scheme: dark;
  /* night city */
  --void: #0f1638; --void-2: #18215a; --nebula: #1b2352; --haze: #3b2c6c;
  --sky: linear-gradient(180deg, #0f1638 0%, #18215a 45%, #2a2a6e 78%, #3b2c6c 100%);
  --gold-rgb: 242, 196, 90;
  --city-1: #0c1230; --city-2: #182152; --city-3: #232c63; --city-win: #ffcf6e;
  /* panels */
  --glass: rgba(var(--gold-rgb), 0.05); --glass-strong: rgba(var(--gold-rgb), 0.11); --glass-line: rgba(var(--gold-rgb), 0.28);
  --glass-under: rgba(17, 23, 58, 0.92);
  --panel-fill: linear-gradient(180deg, rgba(22, 29, 70, 0.9), rgba(14, 19, 50, 0.9));
  /* metals */
  --gold: #f2c45a; --gold-hi: #ffe29a; --gold-lo: #c9932d; --silver: #c9cfdb; --wine: #a83a52; --wine-hi: #d5546e;
  --brass: linear-gradient(180deg, #232b62, #161d4a);
  --brass-gold: linear-gradient(180deg, #ffe29a, #f2c45a 55%, #c9932d);
  --on-gold: #2b1a00;
  /* ink */
  --ink: #f1edff; --ink-dim: #abb1da; --ink-faint: #7c82ad;
  --flux: #9fb4ff; --lamp: #ffcf6e;
  --rift-glow: 0 0 0 1px rgba(var(--gold-rgb), .45), 0 0 18px rgba(var(--gold-rgb), .30);
  /* card numbers (the game's colours on the site's cards) */
  --gc-hp: #52b257; --gc-atk: #ec453b;
  /* the 9 levels: one flat colour (--lvl) + the gem fill (--gem), all from the rarity tokens */
  --r-normal: #c9cfdb; --r-shiny: #ecc768; --r-secret: #c9344b; --r-divine: #fff4d8; --r-divine-2: #d6ad5c; --r-cosmic: #8f7dff;
  --r-godlike: #fffaf0; --r-godlike-2: #e9c877; --r-godly: #f06a92; --r-godly-2: #ffcf6a;
  --r-rainbow: conic-gradient(from 0deg, #e8607a, #e9a75a, #e8dc78, #7fd39a, #69b9e0, #8a7be0, #d36cc0, #e8607a);
  --r-ascended: conic-gradient(from 0deg, #fffaf0, #a9eef5, #c5a8f5, #f5b4dc, #f8e7a8, #b4f0d2, #fffaf0);
  --glow-rainbow: rgb(200, 140, 220); --glow-ascended: rgb(220, 210, 255);   /* --gc-glow-rainbow / -ascended without the alpha */
  /* type */
  --f-display: "Marcellus SC", "Palatino Linotype", Georgia, serif;
  --f-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Anton", "Oswald", "Arial Narrow", Impact, sans-serif;          /* figures: odds, ATK, HP, counts */
  --f-hud: "Russo One", "Nunito Sans", "Arial Black", sans-serif;           /* game-menu labels (Lobby) */
  --fs-xs: 12px; --fs-sm: 14px; --fs-md: 16px; --fs-lg: 20px; --fs-xl: 25px; --fs-2xl: 31px; --fs-3xl: 39px;
  --r-chip: 12px; --r-panel: 14px; --ease: cubic-bezier(.2, .8, .2, 1); --t-fast: 150ms; --t-med: 250ms; --t-slow: 400ms;
  --side-w: 252px; --bar-h: 48px;
  --lvl: var(--r-normal); --gem: var(--r-normal);
}
[data-lvl="shiny"] { --lvl: var(--r-shiny); }       [data-lvl="rainbow"] { --lvl: var(--glow-rainbow); }
[data-lvl="secret"] { --lvl: var(--r-secret); }     [data-lvl="divine"] { --lvl: var(--r-divine); }
[data-lvl="cosmic"] { --lvl: var(--r-cosmic); }     [data-lvl="ascended"] { --lvl: var(--glow-ascended); }
[data-lvl="godlike"] { --lvl: var(--r-godlike-2); } [data-lvl="godly"] { --lvl: var(--r-godly); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--void); }
body { margin: 0; background: var(--void); color: var(--ink); font: 400 var(--fs-md)/1.5 var(--f-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3, p, ul, dl, dd, figure { margin: 0; } ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
img { display: block; max-width: 100%; } svg { display: block; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--f-num); font-weight: 400; letter-spacing: .01em; font-variant-numeric: tabular-nums; line-height: 1; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- mockup switcher (not part of the design) ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--city-1); }
.lab { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--bar-h); display: flex; align-items: center; gap: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--city-1); border-bottom: 1px dashed var(--glass-line); font-size: var(--fs-xs); }
.lab__tag { color: var(--ink-faint); letter-spacing: .12em; text-transform: uppercase; font-weight: 800; }
.lab__seg { display: flex; gap: 4px; margin-right: auto; }
.lab__btn { min-width: 44px; height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--glass-line); color: var(--ink-dim); font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
.lab__btn b { font-weight: 800; color: var(--gold); } .lab__btn span { display: none; }
.lab__btn[aria-pressed="true"] { background: var(--brass-gold); color: var(--on-gold); border-color: transparent; } .lab__btn[aria-pressed="true"] b { color: inherit; }
@media (min-width: 520px) { .lab__btn span { display: inline; } }

/* ---------- the scene (fixed, behind everything) ---------- */
.scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; contain: strict;
  background: radial-gradient(120vmax 60vmax at 50% 112%, var(--haze), transparent 62%), var(--sky); }
.scene > * { position: absolute; }
.sc-stars { inset: 0 -240px 30% 0; opacity: .85; background-size: 240px 250px; animation: starsdrift 120s linear infinite;
  background-image: radial-gradient(1.3px 1.3px at 20px 30px, var(--ink), transparent), radial-gradient(1px 1px at 120px 80px, var(--ink), transparent),
    radial-gradient(1.6px 1.6px at 180px 20px, var(--ink), transparent), radial-gradient(1px 1px at 60px 140px, var(--flux), transparent),
    radial-gradient(1.2px 1.2px at 200px 170px, var(--ink), transparent), radial-gradient(1px 1px at 90px 230px, var(--ink), transparent); }
@keyframes starsdrift { to { transform: translate3d(-240px, 0, 0); } }
.sc-stars::after { content: ""; position: absolute; inset: 0; background-size: 240px 270px;
  background-image: radial-gradient(2px 2px at 70px 60px, var(--ink), transparent), radial-gradient(1.6px 1.6px at 210px 120px, var(--ink), transparent), radial-gradient(2px 2px at 30px 190px, var(--gold-hi), transparent);
  animation: twinkle 2.6s ease-in-out infinite alternate; }
@keyframes twinkle { to { opacity: .2; } }
.sc-moon { right: 7%; top: calc(var(--bar-h) + 8%); width: clamp(54px, 11vw, 96px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, var(--ink), color-mix(in srgb, var(--flux) 55%, var(--ink)) 70%, var(--flux));
  box-shadow: 0 0 40px 10px color-mix(in srgb, var(--flux) 30%, transparent); }
.sc-tod { inset: 0; opacity: 0; transition: opacity var(--t-slow) var(--ease); }     /* time of day: a wash made from the same tokens */
/* the sky moves: stars drift, an aurora waves, mist rolls past the castle, lanterns rise from the town, a star falls now and then (transform / opacity only) */
.sc-aurora { inset: var(--bar-h) -20% auto -20%; height: 46%; opacity: .6; }
.sc-aurora i { position: absolute; inset: 0; transform-origin: 50% 0; }   /* soft by its own gradient: no live blur */
.sc-aurora i:first-child { background: radial-gradient(50% 50% at 38% 45%, color-mix(in srgb, var(--flux) 42%, transparent), transparent), radial-gradient(46% 50% at 64% 50%, color-mix(in srgb, var(--r-cosmic) 42%, transparent), transparent); animation: aurora 17s ease-in-out infinite alternate; }
.sc-aurora i:last-child { inset: 18% 0 0; background: radial-gradient(44% 50% at 42% 50%, color-mix(in srgb, var(--wine-hi) 30%, transparent), transparent), radial-gradient(40% 50% at 68% 46%, color-mix(in srgb, var(--gold) 20%, transparent), transparent); animation: aurora 23s ease-in-out infinite alternate-reverse; }
@keyframes aurora { from { transform: translate3d(-7%, 0, 0) skewX(-14deg) scaleY(.8); opacity: .5; } to { transform: translate3d(7%, 6%, 0) skewX(12deg) scaleY(1.15); opacity: 1; } }
.sc-moon::before { content: ""; position: absolute; inset: -60%; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--flux) 28%, transparent), transparent); animation: halo 4s ease-in-out infinite alternate; }
@keyframes halo { to { transform: scale(1.18); } }
.sc-shoot { top: 13%; left: 64%; width: 120px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--ink)); opacity: 0; animation: shoot 9s ease-in infinite 2s; }
@keyframes shoot { 0%, 86% { opacity: 0; transform: rotate(155deg) translate3d(-120px, 0, 0); } 89% { opacity: 1; } 100% { opacity: 0; transform: rotate(155deg) translate3d(280px, 0, 0); } }
.sc-mist { left: -60%; right: -60%; bottom: 5%; height: 30%; }
.sc-mist i { position: absolute; width: 44%; height: 60%; background: radial-gradient(closest-side, color-mix(in srgb, var(--flux) 26%, transparent), transparent); animation: mist 70s ease-in-out infinite alternate; }
.sc-mist i:nth-child(2) { left: 30%; top: 40%; animation-duration: 95s; animation-delay: -40s; } .sc-mist i:nth-child(3) { left: 56%; top: 14%; animation-duration: 120s; animation-direction: alternate-reverse; }
@keyframes mist { from { transform: translate3d(-30%, 0, 0); } to { transform: translate3d(50%, 0, 0); } }
.sc-lanterns { inset: 0; }
.sc-lanterns i { position: absolute; bottom: 12%; width: 26px; height: 28px; background: radial-gradient(closest-side, var(--lamp) 0 16%, rgba(var(--gold-rgb), .5) 22%, transparent); opacity: 0; animation: lantern linear infinite; will-change: transform; }
@keyframes lantern { 0% { opacity: 0; transform: translate3d(0, 0, 0); } 12% { opacity: .95; } 70% { opacity: .8; } 100% { opacity: 0; transform: translate3d(var(--dx), -72vh, 0) scale(.6); } }
[data-scene="dawn"] .sc-aurora { opacity: .15; } [data-scene="dusk"] .sc-aurora { opacity: .3; }
.sc-city { left: 0; right: 0; bottom: 0; height: min(44vh, 440px); }
.sc-city svg { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; }
.sc-city .c1 { fill: var(--city-1); } .sc-city .c2 { fill: var(--city-2); } .sc-city .c3 { fill: var(--city-3); } .sc-city .w { fill: var(--city-win); }
.sc-city .bd-win2 { animation: twinkle 3.4s ease-in-out infinite alternate; }
.sc-snow { inset: 0; display: none; }
.sc-snow i { position: absolute; top: -12px; border-radius: 50%; background: var(--ink); opacity: .85; animation: snow linear infinite; will-change: transform; }
@keyframes snow { to { transform: translate3d(var(--dx), 104vh, 0); } }
.sc-drift { left: 0; right: 0; bottom: 0; height: 26px; display: none; background: linear-gradient(0deg, color-mix(in srgb, var(--ink) 55%, transparent), transparent); }
[data-scene="dusk"] .sc-tod { opacity: 1; background: linear-gradient(180deg, transparent 22%, color-mix(in srgb, var(--wine-hi) 42%, transparent) 70%, color-mix(in srgb, var(--gold) 55%, transparent)); }
[data-scene="dusk"] .sc-moon { top: 46%; right: 14%; background: radial-gradient(circle at 40% 40%, var(--gold-hi), var(--gold) 70%, var(--gold-lo)); box-shadow: 0 0 60px 18px rgba(var(--gold-rgb), .35); }
[data-scene="dusk"] .sc-stars { opacity: .35; }
[data-scene="dawn"] .sc-tod { opacity: 1; background: linear-gradient(180deg, color-mix(in srgb, var(--flux) 26%, transparent), color-mix(in srgb, var(--wine-hi) 26%, transparent) 62%, color-mix(in srgb, var(--gold-hi) 46%, transparent)); }
[data-scene="dawn"] .sc-moon { opacity: .45; top: calc(var(--bar-h) + 4%); right: 70%; } [data-scene="dawn"] .sc-stars { opacity: .2; }
[data-scene="snow"] .sc-snow, [data-scene="snow"] .sc-drift { display: block; }
[data-scene="snow"] .sc-city .c1 { stroke: color-mix(in srgb, var(--ink) 70%, transparent); stroke-width: 1.2; stroke-dasharray: 9 30; }   /* snow caught on the roofs */
@media (min-width: 1100px) { .sc-city { left: var(--side-w); } }

/* ---------- site chrome (the same in every mockup: menu and routes do not change) ---------- */
.app { position: relative; min-height: 100vh; overflow-x: clip; }
.topbar { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; height: 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar svg { width: 34px; height: 36px; }
.topbar b { display: block; font: 400 var(--fs-md)/1.1 var(--f-display); letter-spacing: .05em; color: var(--gold-hi); }
.topbar span { display: block; font-size: var(--fs-xs); color: var(--ink-faint); }
.nav { position: fixed; z-index: 40; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  height: 68px; border-radius: 20px; border: 1px solid var(--glass-line); background: color-mix(in srgb, var(--void) 88%, transparent);
  box-shadow: 0 10px 30px color-mix(in srgb, var(--city-1) 70%, transparent); }
.nav__brand, .nav__foot { display: none; }
.nav__list { display: grid; grid-template-columns: repeat(4, 1fr); height: 100%; padding: 6px; gap: 4px; }
.nav__btn { display: grid; place-items: center; align-content: center; gap: 2px; width: 100%; height: 100%; border-radius: 14px; color: var(--ink-faint);
  font: 400 11px/1 var(--f-display); letter-spacing: .08em; }
.nav__btn .ico { width: 24px; height: 24px; }
.nav__btn[aria-current="page"] { background: var(--brass-gold); color: var(--on-gold); box-shadow: var(--rift-glow); }
.main { position: relative; z-index: 1; padding-bottom: 110px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1100px) {
  .topbar { display: none; }
  .nav { left: 0; right: auto; top: var(--bar-h); bottom: 0; width: var(--side-w); height: auto; border-radius: 0; border: 0; border-right: 1px solid var(--glass-line);
    display: flex; flex-direction: column; padding: 28px 16px 20px; box-shadow: none; }
  .nav__brand { display: grid; justify-items: center; gap: 10px; padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--glass-line);
    font: 400 var(--fs-md)/1.2 var(--f-display); letter-spacing: .06em; color: var(--gold-hi); }
  .nav__brand svg { width: 66px; height: 70px; }
  .nav__list { grid-template-columns: 1fr; height: auto; padding: 0; gap: 6px; }
  .nav__btn { grid-auto-flow: column; justify-content: start; gap: 14px; height: 48px; padding: 0 16px; font-size: var(--fs-sm); }
  .nav__foot { display: block; margin-top: auto; padding-top: 16px; border-top: 1px solid var(--glass-line); text-align: center; font-size: var(--fs-xs); color: var(--ink-faint); }
  .main { margin-left: var(--side-w); padding-bottom: 64px; }
  .wrap { padding-left: 32px; padding-right: 32px; }
}

/* ---------- shared parts ---------- */
.eyebrow { font: 400 var(--fs-xs)/1 var(--f-display); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.sech { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; font: 400 var(--fs-lg)/1.2 var(--f-display); letter-spacing: .06em; color: var(--gold-hi); }
.sech small { font: 600 var(--fs-xs)/1.2 var(--f-body); letter-spacing: 0; color: var(--ink-faint); }
.sech::after { content: ""; flex: 1; align-self: center; height: 1px; background: linear-gradient(90deg, var(--gold-lo), transparent); }
/* three weights of box: loud / normal / light */
.box { border-radius: var(--r-panel); border: 1px solid var(--glass-line); background: var(--panel-fill); padding: 16px; }
.box--hi { position: relative; border: 0; padding: 18px 16px; background:
  linear-gradient(180deg, color-mix(in srgb, var(--haze) 78%, var(--void)), color-mix(in srgb, var(--void-2) 82%, var(--void))) padding-box,
  linear-gradient(160deg, var(--gold-hi), var(--gold-lo) 40%, color-mix(in srgb, var(--lvl) 70%, var(--gold-lo)) 100%) border-box;
  border: 1.5px solid transparent; box-shadow: 0 14px 34px color-mix(in srgb, var(--city-1) 60%, transparent), inset 0 1px 0 rgba(var(--gold-rgb), .25); }
.box--lite { border-top: 1px solid var(--glass-line); padding: 14px 0 0; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--r-chip);
  border: 1px solid var(--glass-line); background: var(--brass); color: var(--ink); font: 400 var(--fs-sm)/1 var(--f-display); letter-spacing: .08em;
  transition: transform var(--t-fast) var(--ease); }
.btn--gold { background: var(--brass-gold); color: var(--on-gold); border-color: transparent; box-shadow: var(--rift-glow); }
.press:active { transform: scale(.96); }
.press::after { content: ""; position: absolute; inset: -3px; border-radius: inherit; border: 2px solid var(--gold-hi); opacity: 0; pointer-events: none; }
.press.is-hit::after { animation: ring 420ms var(--ease); }
@keyframes ring { 0% { opacity: .9; transform: scale(.96); } 100% { opacity: 0; transform: scale(1.08); } }
.kind { display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 999px; background: var(--brass-gold); color: var(--on-gold);
  font: 400 var(--fs-xs)/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; }
.date { font-size: var(--fs-xs); color: var(--ink-faint); font-variant-numeric: tabular-nums; }
/* a code you tap to copy */
.code { position: relative; flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px 0 12px; border-radius: 10px;
  border: 1px dashed var(--gold-lo); background: var(--glass); color: var(--gold-hi); font: 800 var(--fs-sm)/1 var(--f-body); letter-spacing: .08em;
  transition: transform var(--t-fast) var(--ease); }
.code .ico { width: 16px; height: 16px; color: var(--ink-dim); }
.code.is-done { border-style: solid; border-color: var(--gold); } .code.is-done .ico { color: var(--gold-hi); }
/* a picture of one of the site's cards */
.gcimg { width: 100%; height: auto; aspect-ratio: 3 / 4; border-radius: 3.7% / 2.78%; }
/* card that turns over: back (our own design) → face */
.flip { position: relative; display: block; aspect-ratio: 3 / 4; perspective: 700px; flex: none; }
.flip__in { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(180deg); transition: transform 520ms var(--ease); }
.flip.is-up .flip__in { transform: rotateY(0deg); }
.flip__f, .flip__b { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip__b { transform: rotateY(180deg); }
.flip__b svg { width: 100%; height: 100%; }
/* our card back (drawn here, tokens only) */
.bk-field { fill: var(--void-2); } .bk-glow { fill: var(--haze); } .bk-line { fill: none; stroke: var(--gold); stroke-width: 3; }
.bk-line2 { fill: none; stroke: var(--gold-lo); stroke-width: 1.2; stroke-dasharray: 2 5; } .bk-lat { fill: none; stroke: rgba(var(--gold-rgb), .22); stroke-width: 1; }
.bk-ring { fill: var(--void); stroke: var(--gold); stroke-width: 2; } .bk-ring2 { fill: none; stroke: var(--gold-lo); stroke-width: 1; stroke-dasharray: 1.5 4; }
.bk-c1 { fill: var(--flux); stroke: var(--gold-hi); stroke-width: 2; } .bk-c2 { fill: var(--r-cosmic); stroke: var(--gold-hi); stroke-width: 2; }
.bk-inf { fill: none; stroke: var(--gold-hi); stroke-width: 6; stroke-linecap: round; } .bk-dot { fill: var(--gold-hi); } .bk-star { fill: var(--ink); opacity: .7; }
/* the 9 levels */
/* the wall: the cards that came with the newest update, drifting past in rows (transform only · one layer per row · stops under the pointer) */
.wall { --cw: 84px; --wg: 8px; display: grid; gap: var(--wg); justify-self: stretch; margin-inline: -34px; padding-block: 12px; overflow: hidden; transform: rotate(-3deg); }
.wall__row { display: flex; width: max-content; animation: drift var(--d, 400s) linear infinite; will-change: transform; }
.wall__row:nth-child(even) { animation-direction: reverse; }
@media (hover: hover) { .wall:hover .wall__row { animation-play-state: paused; } }
@keyframes drift { to { transform: translate3d(-50%, 0, 0); } }
.wc { flex: none; width: var(--cw); aspect-ratio: 3 / 4; margin-right: var(--wg); border-radius: 3.7% / 2.78%; background-size: 1000% 500%; background-repeat: no-repeat;
  box-shadow: 0 6px 14px color-mix(in srgb, var(--city-1) 70%, transparent); transition: transform var(--t-fast) var(--ease); }
.wc:active { transform: scale(.94); }

      lan.innerHTML = Array.from({ length: 14 }, () => `<i style="left:${(4 + r2() * 92).toFixed(1)}%;--dx:${(r2() * 90 - 45).toFixed(0)}px;animation-duration:${(16 + r2() * 14).toFixed(1)}s;animation-delay:-${(r2() * 28).toFixed(1)}s"></i>`).join("");
    }

    if (real === "snow" && !snow.childElementCount) {

        return `<i style="left:${(rnd() * 100).toFixed(1)}%;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;--dx:${(rnd() * 60 - 30).toFixed(0)}px;--rest:${(rnd() * 90).toFixed(0)}vh;animation-duration:${(7 + rnd() * 8).toFixed(1)}s;animation-delay:-${(rnd() * 12).toFixed(1)}s"></i>`; }).join("");
    }
  }
  $("#scene-btn").addEventListener("click", () => { scene = SCENES[(SCENES.indexOf(scene) + 1) % SCENES.length]; paintScene(); });

  /* ---------- A / B / C ---------- */
  function show(m, user) {

    };
    if (user) vt(swap); else swap();
  }
  if (matchMedia("(min-width: 1100px)").matches) $$(".b-sec").forEach((d) => { d.open = true; });
