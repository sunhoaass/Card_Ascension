<meta charset="utf-8">
<title>Infinity Home Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=Anton&family=Russo+One&display=swap">
<style>
/* Card Battle Infinity — Home mockups (look round 0 · 2026-11-10 · PROGRESS ▶️ "🎨 แผนหน้าตาใหม่")
   Three different Home pages on the same data: A "Altar" (Card of the Day hero, the level colours the page) ·
   B "Gazette" (the update as a front page) · C "Lobby" (a game hub: daily draw + big menu plates).
   Layout concept: phone first, one column; from 1100px the site's left menu + a wide grid.
   Colours: every value below is copied from css/tokens.css ("Castle Night": night navy, never black). Nothing else sets a colour.
   Cards are pictures of the site's own cards (C.renderCard), not game files. The castle is the site's own FX.backdrop drawing. */
:root {
  color-scheme: dark;
  /* night city */
  --void: #0f1638; --void-2: #18215a; --nebula: #1b2352; --haze: #3b2c6c;
  --sky: linear-gradient(180deg, #0f1638 0%, #18215a 45%, #2a2a6e 78%, #3b2c6c 100%);
  --gold-rgb: 242, 196, 90;
  --city-1: #0c1230; --city-2: #182152; --city-3: #232c63; --city-win: #ffcf6e;
  /* panels */
  --glass: rgba(var(--gold-rgb), 0.05); --glass-strong: rgba(var(--gold-rgb), 0.11); --glass-line: rgba(var(--gold-rgb), 0.28);
  --glass-under: rgba(17, 23, 58, 0.92);
  --panel-fill: linear-gradient(180deg, rgba(22, 29, 70, 0.9), rgba(14, 19, 50, 0.9));
  /* metals */
  --gold: #f2c45a; --gold-hi: #ffe29a; --gold-lo: #c9932d; --silver: #c9cfdb; --wine: #a83a52; --wine-hi: #d5546e;
  --brass: linear-gradient(180deg, #232b62, #161d4a);
  --brass-gold: linear-gradient(180deg, #ffe29a, #f2c45a 55%, #c9932d);
  --on-gold: #2b1a00;
  /* ink */
  --ink: #f1edff; --ink-dim: #abb1da; --ink-faint: #7c82ad;
  --flux: #9fb4ff; --lamp: #ffcf6e;
  --rift-glow: 0 0 0 1px rgba(var(--gold-rgb), .45), 0 0 18px rgba(var(--gold-rgb), .30);
  /* card numbers (the game's colours on the site's cards) */
  --gc-hp: #52b257; --gc-atk: #ec453b;
  /* the 9 levels: one flat colour (--lvl) + the gem fill (--gem), all from the rarity tokens */
  --r-normal: #c9cfdb; --r-shiny: #ecc768; --r-secret: #c9344b; --r-divine: #fff4d8; --r-divine-2: #d6ad5c; --r-cosmic: #8f7dff;
  --r-godlike: #fffaf0; --r-godlike-2: #e9c877; --r-godly: #f06a92; --r-godly-2: #ffcf6a;
  --r-rainbow: conic-gradient(from 0deg, #e8607a, #e9a75a, #e8dc78, #7fd39a, #69b9e0, #8a7be0, #d36cc0, #e8607a);
  --r-ascended: conic-gradient(from 0deg, #fffaf0, #a9eef5, #c5a8f5, #f5b4dc, #f8e7a8, #b4f0d2, #fffaf0);
  --glow-rainbow: rgb(200, 140, 220); --glow-ascended: rgb(220, 210, 255);   /* --gc-glow-rainbow / -ascended without the alpha */
  /* type */
  --f-display: "Marcellus SC", "Palatino Linotype", Georgia, serif;
  --f-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Anton", "Oswald", "Arial Narrow", Impact, sans-serif;          /* figures: odds, ATK, HP, counts */
  --f-hud: "Russo One", "Nunito Sans", "Arial Black", sans-serif;           /* game-menu labels (Lobby) */
  --fs-xs: 12px; --fs-sm: 14px; --fs-md: 16px; --fs-lg: 20px; --fs-xl: 25px; --fs-2xl: 31px; --fs-3xl: 39px;
  --r-chip: 12px; --r-panel: 14px; --ease: cubic-bezier(.2, .8, .2, 1); --t-fast: 150ms; --t-med: 250ms; --t-slow: 400ms;
  --side-w: 252px; --bar-h: 48px;
  --lvl: var(--r-normal); --gem: var(--r-normal);
}
[data-lvl="shiny"] { --lvl: var(--r-shiny); }       [data-lvl="rainbow"] { --lvl: var(--glow-rainbow); }
[data-lvl="secret"] { --lvl: var(--r-secret); }     [data-lvl="divine"] { --lvl: var(--r-divine); }
[data-lvl="cosmic"] { --lvl: var(--r-cosmic); }     [data-lvl="ascended"] { --lvl: var(--glow-ascended); }
[data-lvl="godlike"] { --lvl: var(--r-godlike-2); } [data-lvl="godly"] { --lvl: var(--r-godly); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--void); }
body { margin: 0; background: var(--void); color: var(--ink); font: 400 var(--fs-md)/1.5 var(--f-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3, p, ul, dl, dd, figure { margin: 0; } ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
img { display: block; max-width: 100%; } svg { display: block; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--f-num); font-weight: 400; letter-spacing: .01em; font-variant-numeric: tabular-nums; line-height: 1; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- mockup switcher (not part of the design) ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--city-1); }
.lab { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--bar-h); display: flex; align-items: center; gap: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--city-1); border-bottom: 1px dashed var(--glass-line); font-size: var(--fs-xs); }
.lab__tag { color: var(--ink-faint); letter-spacing: .12em; text-transform: uppercase; font-weight: 800; }
.lab__seg { display: flex; gap: 4px; margin-right: auto; }
.lab__btn { min-width: 44px; height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--glass-line); color: var(--ink-dim); font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
.lab__btn b { font-weight: 800; color: var(--gold); } .lab__btn span { display: none; }
.lab__btn[aria-pressed="true"] { background: var(--brass-gold); color: var(--on-gold); border-color: transparent; } .lab__btn[aria-pressed="true"] b { color: inherit; }
@media (min-width: 520px) { .lab__btn span { display: inline; } }

/* ---------- the scene (fixed, behind everything) ---------- */
.scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; contain: strict;
  background: radial-gradient(120vmax 60vmax at 50% 112%, var(--haze), transparent 62%), var(--sky); }
.scene > * { position: absolute; }
.sc-stars { inset: 0 0 30% 0; opacity: .85; background-size: 240px 250px;
  background-image: radial-gradient(1.3px 1.3px at 20px 30px, var(--ink), transparent), radial-gradient(1px 1px at 120px 80px, var(--ink), transparent),
    radial-gradient(1.6px 1.6px at 180px 20px, var(--ink), transparent), radial-gradient(1px 1px at 60px 140px, var(--flux), transparent),
    radial-gradient(1.2px 1.2px at 200px 170px, var(--ink), transparent), radial-gradient(1px 1px at 90px 230px, var(--ink), transparent); }
.sc-stars::after { content: ""; position: absolute; inset: 0; background-size: 260px 270px;
  background-image: radial-gradient(2px 2px at 70px 60px, var(--ink), transparent), radial-gradient(1.6px 1.6px at 210px 120px, var(--ink), transparent), radial-gradient(2px 2px at 30px 190px, var(--gold-hi), transparent);
  animation: twinkle 2.6s ease-in-out infinite alternate; }
@keyframes twinkle { to { opacity: .2; } }
.sc-moon { right: 7%; top: calc(var(--bar-h) + 8%); width: clamp(54px, 11vw, 96px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, var(--ink), color-mix(in srgb, var(--flux) 55%, var(--ink)) 70%, var(--flux));
  box-shadow: 0 0 40px 10px color-mix(in srgb, var(--flux) 30%, transparent); }
.sc-tod { inset: 0; opacity: 0; transition: opacity var(--t-slow) var(--ease); }     /* time of day: a wash made from the same tokens */
.sc-tint { inset: 0; opacity: 0; background: radial-gradient(90vmax 46vmax at 50% 30%, color-mix(in srgb, var(--lvl) 34%, transparent), transparent 70%),
  linear-gradient(0deg, color-mix(in srgb, var(--lvl) 16%, transparent), transparent 40%); }
.sc-city { left: 0; right: 0; bottom: 0; height: min(44vh, 440px); }
.sc-city svg { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; }
.sc-city .c1 { fill: var(--city-1); } .sc-city .c2 { fill: var(--city-2); } .sc-city .c3 { fill: var(--city-3); } .sc-city .w { fill: var(--city-win); }
.sc-city .bd-win2 { animation: twinkle 3.4s ease-in-out infinite alternate; }
.sc-snow { inset: 0; display: none; }
.sc-snow i { position: absolute; top: -12px; border-radius: 50%; background: var(--ink); opacity: .85; animation: snow linear infinite; will-change: transform; }
@keyframes snow { to { transform: translate3d(var(--dx), 104vh, 0); } }
.sc-drift { left: 0; right: 0; bottom: 0; height: 26px; display: none; background: linear-gradient(0deg, color-mix(in srgb, var(--ink) 55%, transparent), transparent); }
[data-scene="dusk"] .sc-tod { opacity: 1; background: linear-gradient(180deg, transparent 22%, color-mix(in srgb, var(--wine-hi) 42%, transparent) 70%, color-mix(in srgb, var(--gold) 55%, transparent)); }
[data-scene="dusk"] .sc-moon { top: 46%; right: 14%; background: radial-gradient(circle at 40% 40%, var(--gold-hi), var(--gold) 70%, var(--gold-lo)); box-shadow: 0 0 60px 18px rgba(var(--gold-rgb), .35); }
[data-scene="dusk"] .sc-stars { opacity: .35; }
[data-scene="dawn"] .sc-tod { opacity: 1; background: linear-gradient(180deg, color-mix(in srgb, var(--flux) 26%, transparent), color-mix(in srgb, var(--wine-hi) 26%, transparent) 62%, color-mix(in srgb, var(--gold-hi) 46%, transparent)); }
[data-scene="dawn"] .sc-moon { opacity: .45; top: calc(var(--bar-h) + 4%); right: 70%; } [data-scene="dawn"] .sc-stars { opacity: .2; }
[data-scene="snow"] .sc-snow, [data-scene="snow"] .sc-drift { display: block; }
[data-scene="snow"] .sc-city .c1 { stroke: color-mix(in srgb, var(--ink) 70%, transparent); stroke-width: 1.2; stroke-dasharray: 9 30; }   /* snow caught on the roofs */
@media (min-width: 1100px) { .sc-city { left: var(--side-w); } }

/* ---------- site chrome (the same in every mockup: menu and routes do not change) ---------- */
.app { position: relative; min-height: 100vh; overflow-x: clip; }
.topbar { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; height: 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar svg { width: 34px; height: 36px; }
.topbar b { display: block; font: 400 var(--fs-md)/1.1 var(--f-display); letter-spacing: .05em; color: var(--gold-hi); }
.topbar span { display: block; font-size: var(--fs-xs); color: var(--ink-faint); }
.nav { position: fixed; z-index: 40; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  height: 68px; border-radius: 20px; border: 1px solid var(--glass-line); background: color-mix(in srgb, var(--void) 88%, transparent);
  box-shadow: 0 10px 30px color-mix(in srgb, var(--city-1) 70%, transparent); }
.nav__brand, .nav__foot { display: none; }
.nav__list { display: grid; grid-template-columns: repeat(4, 1fr); height: 100%; padding: 6px; gap: 4px; }
.nav__btn { display: grid; place-items: center; align-content: center; gap: 2px; width: 100%; height: 100%; border-radius: 14px; color: var(--ink-faint);
  font: 400 11px/1 var(--f-display); letter-spacing: .08em; }
.nav__btn .ico { width: 24px; height: 24px; }
.nav__btn[aria-current="page"] { background: var(--brass-gold); color: var(--on-gold); box-shadow: var(--rift-glow); }
.main { position: relative; z-index: 1; padding-bottom: 110px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1100px) {
  .topbar { display: none; }
  .nav { left: 0; right: auto; top: var(--bar-h); bottom: 0; width: var(--side-w); height: auto; border-radius: 0; border: 0; border-right: 1px solid var(--glass-line);
    display: flex; flex-direction: column; padding: 28px 16px 20px; box-shadow: none; }
  .nav__brand { display: grid; justify-items: center; gap: 10px; padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--glass-line);
    font: 400 var(--fs-md)/1.2 var(--f-display); letter-spacing: .06em; color: var(--gold-hi); }
  .nav__brand svg { width: 66px; height: 70px; }
  .nav__list { grid-template-columns: 1fr; height: auto; padding: 0; gap: 6px; }
  .nav__btn { grid-auto-flow: column; justify-content: start; gap: 14px; height: 48px; padding: 0 16px; font-size: var(--fs-sm); }
  .nav__foot { display: block; margin-top: auto; padding-top: 16px; border-top: 1px solid var(--glass-line); text-align: center; font-size: var(--fs-xs); color: var(--ink-faint); }
  .main { margin-left: var(--side-w); padding-bottom: 64px; }
  .wrap { padding-left: 32px; padding-right: 32px; }
}

/* ---------- shared parts ---------- */
.eyebrow { font: 400 var(--fs-xs)/1 var(--f-display); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.sech { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; font: 400 var(--fs-lg)/1.2 var(--f-display); letter-spacing: .06em; color: var(--gold-hi); }
.sech small { font: 600 var(--fs-xs)/1.2 var(--f-body); letter-spacing: 0; color: var(--ink-faint); }
.sech::after { content: ""; flex: 1; align-self: center; height: 1px; background: linear-gradient(90deg, var(--gold-lo), transparent); }
/* three weights of box: loud / normal / light */
.box { border-radius: var(--r-panel); border: 1px solid var(--glass-line); background: var(--panel-fill); padding: 16px; }
.box--hi { position: relative; border: 0; padding: 18px 16px; background:
  linear-gradient(180deg, color-mix(in srgb, var(--haze) 78%, var(--void)), color-mix(in srgb, var(--void-2) 82%, var(--void))) padding-box,
  linear-gradient(160deg, var(--gold-hi), var(--gold-lo) 40%, color-mix(in srgb, var(--lvl) 70%, var(--gold-lo)) 100%) border-box;
  border: 1.5px solid transparent; box-shadow: 0 14px 34px color-mix(in srgb, var(--city-1) 60%, transparent), inset 0 1px 0 rgba(var(--gold-rgb), .25); }
.box--lite { border-top: 1px solid var(--glass-line); padding: 14px 0 0; }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--r-chip);
  border: 1px solid var(--glass-line); background: var(--brass); color: var(--ink); font: 400 var(--fs-sm)/1 var(--f-display); letter-spacing: .08em;
  transition: transform var(--t-fast) var(--ease); }
.btn--gold { background: var(--brass-gold); color: var(--on-gold); border-color: transparent; box-shadow: var(--rift-glow); }
.press:active { transform: scale(.96); }
.press::after { content: ""; position: absolute; inset: -3px; border-radius: inherit; border: 2px solid var(--gold-hi); opacity: 0; pointer-events: none; }
.press.is-hit::after { animation: ring 420ms var(--ease); }
@keyframes ring { 0% { opacity: .9; transform: scale(.96); } 100% { opacity: 0; transform: scale(1.08); } }
.kind { display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 999px; background: var(--brass-gold); color: var(--on-gold);
  font: 400 var(--fs-xs)/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; }
.date { font-size: var(--fs-xs); color: var(--ink-faint); font-variant-numeric: tabular-nums; }
/* a code you tap to copy */
.code { position: relative; flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px 0 12px; border-radius: 10px;
  border: 1px dashed var(--gold-lo); background: var(--glass); color: var(--gold-hi); font: 800 var(--fs-sm)/1 var(--f-body); letter-spacing: .08em;
  transition: transform var(--t-fast) var(--ease); }
.code .ico { width: 16px; height: 16px; color: var(--ink-dim); }
.code.is-done { border-style: solid; border-color: var(--gold); } .code.is-done .ico { color: var(--gold-hi); }
/* a picture of one of the site's cards */
.gcimg { width: 100%; height: auto; aspect-ratio: 3 / 4; border-radius: 3.7% / 2.78%; }
/* card that turns over: back (our own design) → face */
.flip { position: relative; display: block; aspect-ratio: 3 / 4; perspective: 700px; flex: none; }
.flip__in { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(180deg); transition: transform 520ms var(--ease); }
.flip.is-up .flip__in { transform: rotateY(0deg); }
.flip__f, .flip__b { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip__b { transform: rotateY(180deg); }
.flip__b svg { width: 100%; height: 100%; }
/* our card back (drawn here, tokens only) */
.bk-field { fill: var(--void-2); } .bk-glow { fill: var(--haze); } .bk-line { fill: none; stroke: var(--gold); stroke-width: 3; }
.bk-line2 { fill: none; stroke: var(--gold-lo); stroke-width: 1.2; stroke-dasharray: 2 5; } .bk-lat { fill: none; stroke: rgba(var(--gold-rgb), .22); stroke-width: 1; }
.bk-ring { fill: var(--void); stroke: var(--gold); stroke-width: 2; } .bk-ring2 { fill: none; stroke: var(--gold-lo); stroke-width: 1; stroke-dasharray: 1.5 4; }
.bk-c1 { fill: var(--flux); stroke: var(--gold-hi); stroke-width: 2; } .bk-c2 { fill: var(--r-cosmic); stroke: var(--gold-hi); stroke-width: 2; }
.bk-inf { fill: none; stroke: var(--gold-hi); stroke-width: 6; stroke-linecap: round; } .bk-dot { fill: var(--gold-hi); } .bk-star { fill: var(--ink); opacity: .7; }
/* the 9 levels */
.rail { display: grid; grid-template-columns: repeat(9, 1fr); border-radius: 999px; border: 1px solid var(--glass-line); background: color-mix(in srgb, var(--void) 72%, transparent); }
.rail button { position: relative; height: 44px; display: grid; place-items: center; }
.rail i { width: 18px; height: 18px; border-radius: 5px; transform: rotate(45deg) scale(.82); background: var(--g); border: 1.5px solid color-mix(in srgb, var(--void) 55%, transparent);
  box-shadow: 0 0 0 1px rgba(var(--gold-rgb), .35); transition: transform var(--t-med) var(--ease); }
.rail button[aria-checked="true"] i { transform: rotate(45deg) scale(1.25); box-shadow: 0 0 0 2px var(--gold-hi), 0 0 14px 2px var(--c); }
.lvlname { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; background: color-mix(in srgb, var(--lvl) 24%, var(--void));
  border: 1px solid color-mix(in srgb, var(--lvl) 70%, transparent); color: var(--ink); font: 400 var(--fs-xs)/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; }
/* update sections as tabs (A) or tiles (C) */
.cats { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; } .cats::-webkit-scrollbar { display: none; }
.cat { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--glass-line);
  color: var(--ink-dim); font: 600 var(--fs-sm)/1 var(--f-body); white-space: nowrap; transition: transform var(--t-fast) var(--ease); }
.cat b { font: 400 var(--fs-sm)/1 var(--f-num); color: var(--gold); }
.cat[aria-selected="true"] { background: var(--brass-gold); color: var(--on-gold); border-color: transparent; } .cat[aria-selected="true"] b { color: inherit; }
.items { display: grid; gap: 8px; margin-top: 12px; color: var(--ink-dim); font-size: var(--fs-sm); max-width: 72ch; }
.items li { position: relative; padding-left: 18px; }
.items li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 7px; height: 7px; transform: rotate(45deg); background: var(--gold); }
.items.is-in li { animation: up 320ms var(--ease) both; animation-delay: calc(var(--i) * 40ms); }
@keyframes up { from { opacity: 0; transform: translateY(8px); } }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 14px 0; }
.fig { padding: 0 12px; border-left: 1px solid var(--glass-line); }
.fig b { display: block; font: 400 var(--fs-3xl)/1 var(--f-num); color: var(--gold-hi); }
.fig span { display: block; margin-top: 4px; font-size: var(--fs-xs); color: var(--ink-dim); white-space: nowrap; }
.toast { position: fixed; z-index: 70; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); padding: 10px 16px; border-radius: 999px;
  background: var(--brass-gold); color: var(--on-gold); font: 800 var(--fs-sm)/1 var(--f-body); opacity: 0; pointer-events: none; transition: opacity var(--t-med) var(--ease), transform var(--t-med) var(--ease); }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }
.hrow { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.hrow::-webkit-scrollbar { display: none; } .hrow > * { scroll-snap-align: start; }
.mock { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; padding-top: 4px; }
/* one-column grids never grow wider than the screen (rows that scroll sideways live inside them) */

/* ==========================================================
   A · ALTAR — one card on a pedestal, its level colours the whole page
   ========================================================== */

  box-shadow: 0 0 60px 14px color-mix(in srgb, var(--lvl) 35%, transparent); }

  background: linear-gradient(0deg, color-mix(in srgb, var(--lvl) 62%, transparent), color-mix(in srgb, var(--lvl) 18%, transparent) 55%, transparent);
  animation: breathe 3.6s ease-in-out infinite alternate; }

  background: radial-gradient(closest-side, color-mix(in srgb, var(--lvl) 75%, transparent), transparent); }

.a-side { position: absolute; z-index: 1; bottom: 30px; width: 104px; display: grid; gap: 6px; justify-items: center; font: 400 10px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }

  background: linear-gradient(155deg, var(--haze), var(--void-2) 50%, var(--void)); border: 1.5px solid var(--gold); box-shadow: 0 10px 24px color-mix(in srgb, var(--city-1) 70%, transparent); }

  .a-codes { grid-column: 1 / -1; margin: 0; border: 1px solid var(--glass-line); border-radius: var(--r-panel); }
  .a-hero { grid-column: 1 / -1; grid-template-columns: 470px minmax(0, 1fr); align-items: center; gap: 0 28px; }
  .a-hero__head { grid-column: 1 / -1; }
  .a-stage { height: 470px; max-width: none; } .a-stage::before { width: 400px; margin-left: -200px; top: -10px; }
  .a-card { width: 318px; } .a-beam { width: 300px; margin-left: -150px; height: 560px; } .a-ped { width: 360px; margin-left: -180px; height: 46px; }
  .a-side { width: 112px; bottom: 70px; } .a-side--prev { left: -22px; justify-items: start; } .a-side--next { right: -22px; justify-items: end; }
  .a-info { justify-items: start; text-align: left; gap: 18px; } .a-name { font-size: var(--fs-3xl); } .a-figs b { font-size: 38px; } .a-figs { gap: 0 28px; justify-content: start; } .a-figs div { justify-items: start; }

.c-menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.plate { position: relative; overflow: hidden; height: 104px; padding: 12px; border-radius: var(--r-panel); text-align: left; display: grid; align-content: space-between; justify-items: start;
  background: var(--brass); border: 2px solid var(--gold-lo); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--void) 70%, transparent), inset 0 -6px 0 color-mix(in srgb, var(--void) 55%, transparent), 0 6px 14px color-mix(in srgb, var(--city-1) 55%, transparent);
  transition: transform var(--t-fast) var(--ease); }
.plate img { position: absolute; right: -6px; top: -8px; width: 62%; height: 130%; object-fit: cover; object-position: 50% 12%; opacity: .9;
  -webkit-mask-image: linear-gradient(90deg, transparent, var(--void) 55%); mask-image: linear-gradient(90deg, transparent, var(--void) 55%); }
.plate > :not(img) { position: relative; }
.plate .hud { font-size: var(--fs-md); text-shadow: 0 2px 0 var(--void); }
.plate b { font: 400 var(--fs-3xl)/1 var(--f-num); color: var(--ink); text-shadow: 0 2px 0 var(--void); }
.plate b.txt { font: 600 var(--fs-xs)/1.2 var(--f-body); color: var(--ink-dim); }
.c-board { display: grid; gap: 12px; }
.c-board__head { display: grid; gap: 6px; }
.c-board__head h2 { font: 400 var(--fs-xl)/1.05 var(--f-hud); letter-spacing: .03em; text-transform: uppercase; color: var(--gold-hi); }
.c-board__head p { display: flex; align-items: center; gap: 10px; }
.c-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { position: relative; display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; border-radius: 10px; text-align: left;
  background: var(--glass); border: 1px solid var(--glass-line); color: var(--ink-dim); font: 600 var(--fs-sm)/1.15 var(--f-body); transition: transform var(--t-fast) var(--ease); }
.tile .ico { color: var(--gold); } .tile b { font: 400 var(--fs-lg)/1 var(--f-num); color: var(--gold-hi); }
.tile[aria-selected="true"] { background: var(--brass-gold); color: var(--on-gold); border-color: transparent; } .tile[aria-selected="true"] .ico, .tile[aria-selected="true"] b { color: inherit; }
.c-new { overflow: hidden; margin-inline: -16px; }
.c-new .sech { margin-inline: 16px; font-family: var(--f-hud); font-size: var(--fs-md); text-transform: uppercase; }
.c-new__track { display: flex; gap: 10px; width: max-content; padding-left: 16px; animation: marquee 46s linear infinite; }
.c-new__track:hover, .c-new__track:active { animation-play-state: paused; }
.c-new__track button { width: 104px; flex: none; }
@keyframes marquee { to { transform: translateX(-50%); } }
.c-sys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
.c-sys .sech { grid-column: 1 / -1; margin: 0; font-family: var(--f-hud); font-size: var(--fs-md); text-transform: uppercase; }
.c-sys .sys { grid-template-columns: 1fr; align-content: start; gap: 6px; } .c-sys .sys .ico { grid-row: auto; } .c-sys .sys b { font: 400 var(--fs-sm)/1.2 var(--f-hud); letter-spacing: .03em; }
@media (min-width: 1100px) {
  .mock--c { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px 32px; align-items: start; padding-top: 24px; max-width: 1320px; }
  .c-stage { grid-row: span 2; } .c-table { height: 420px; } .c-floor { width: 560px; margin-left: -280px; height: 150px; }
  .c-draw--m { width: 264px; margin-left: -132px; bottom: 56px; } .c-draw--l { width: 180px; margin-left: -292px; bottom: 62px; } .c-draw--r { width: 180px; margin-left: 112px; bottom: 62px; }
  .c-railwrap { width: min(100%, 520px); }
  .c-read { padding-top: 14px; } .c-read__name { font-size: var(--fs-2xl); } .c-chip { height: 40px; padding-top: 10px; } .c-chip b { font-size: var(--fs-xl); }
  .plate { height: 132px; } .c-board { grid-column: 1; } .c-tiles { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .c-new { grid-column: 1 / -1; margin: 0; } .c-new .sech { margin-inline: 0; } .c-new__track { padding-left: 0; } .c-new__track button { width: 132px; }
  .c-sys { grid-column: 2; grid-row: 3; }
}

/* small phones (360px): the level strip runs edge to edge so every gem keeps a 40px target */
@media (max-width: 379px) {
  .lab__tag { display: none; }
  .a-info .rail, .c-railwrap { width: calc(100% + 32px); } .b-cotd .rail { margin-inline: -16px; }
  .rail { border-radius: 0; border-inline: 0; }
}

/* ---------- view transition between mockups / levels (opacity only) ---------- */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 260ms; animation-timing-function: var(--ease); }
/* ---------- reduced motion: fades only ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }
  .flip__in { transition: none; } .sc-snow i { top: var(--rest); }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; }
}

        <div class="hrow">${NEW_CARDS.map((id) => flipHTML("n_" + id, CARDS[id].name)).join("")}${NEW_SUP.map((id) => flipHTML("s_" + id, CARDS[id].name)).join("")}</div>
      </div>
      <button class="btn press a-pull__more" type="button" id="pull-more" hidden>See all ${COUNTS.newCards} new cards</button>
    </section>
    <section class="a-news box" aria-label="Game update">
      <div class="a-news__head"><span class="kind">Major update</span><time class="date" datetime="${UPDATE.date}">${fmtDate(UPDATE.date)}</time></div>
      <h2>${esc(UPDATE.title)}</h2>
      <div class="figs">${figsHTML()}</div>
      <div>
        <div class="cats" role="tablist" data-cats>${SECS.map((s, i) => `<button class="cat press" type="button" role="tab" aria-selected="${i === 0}" data-sec="${i}">${use(s.icon)}${esc(s.name)} <b>${s.items.length}</b></button>`).join("")}</div>
        <ul class="items" data-items>${itemsHTML(SECS[0])}</ul>
      </div>
    </section>
    <section class="a-sys" aria-label="New systems">
      <h2 class="sech">New systems</h2>
      <div class="box--lite" style="display:grid;gap:14px">${sysHTML()}</div>
    </section>`;
  function flipHTML(file, name) { return `<button class="flip" type="button" aria-label="${esc(name)}"><span class="flip__in"><span class="flip__f">${img(file, name, 'loading="lazy"')}</span><span class="flip__b">${back()}</span></span></button>`; }

  /* ==================== B · Gazette ==================== */
  const dayNo = Math.round((TODAY - new Date(TODAY.getFullYear(), 0, 0)) / 864e5);
  $("#m-b").innerHTML = `<div class="b-sheet">
    <header class="b-mast">
      <div class="b-mast__rule"><span>Night edition</span><span>No. ${dayNo}</span></div>
      <p class="b-mast__name">The Infinity Gazette</p>
      <div class="b-mast__meta"><span>${TODAY.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" })}</span><span>${COUNTS.cards} cards · ${COUNTS.support} support</span></div>
    </header>
    <article class="b-lead">
      <p class="b-kicker"><span class="stamp">Major update</span><time class="date" datetime="${UPDATE.date}">${fmtDate(UPDATE.date)}</time></p>
      <h1 class="b-head">${esc(UPDATE.title)}</h1>
      <p class="b-deck">Five new worlds, a hundred new cards, Dungeons you can run AFK and a 1,000-floor Key Tower.</p>
      <div class="b-fan">${FAN.map(([id], i) => `<button type="button" aria-label="${esc(CARDS[id].name)}" style="--r:${(i - 2) * 11}deg;z-index:${i === 2 ? 5 : 4 - Math.abs(i - 2)}">${img("f_" + id, CARDS[id].name)}</button>`).join("")}</div>
      <p class="b-cap">${FAN.map(([id]) => CARDS[id].name).join(" · ")}</p>
      <div class="figs b-figs">${figsHTML()}</div>
    </article>
    <aside class="b-coupons" aria-label="Codes">
      <h2 class="b-h">Clip and redeem <small>${NEWS.codes.length} codes</small></h2>
      <div class="hrow">${NEWS.codes.map((c) => `<button class="coupon press" type="button" data-code="${esc(c.code)}" aria-label="Copy code ${esc(c.code)}"><span class="coupon__c"><b>${esc(c.code)}</b><span>${esc(c.reward)}</span></span><span class="coupon__x">${use("i-copy")}</span></button>`).join("")}</div>
    </aside>
    <section class="b-cotd" aria-label="Card of the Day">
      <h2 class="b-h">Card of the Day <small><span class="lvlname" data-cotd="lvl">Normal</span></small></h2>
      <button type="button" data-cotd-card aria-label="Open ${esc(cotd.name)}" style="position:relative">${img("h_normal", cotd.name, "data-cotd-img")}<i class="a-card__flash"></i></button>
      <div class="b-cotd__t">
        <h3>${esc(cotd.name)}</h3>
        <blockquote>${esc(cotd.desc.split(". ")[0])}.</blockquote>
        <div class="b-score"><span>1 in</span><b data-cotd="odds"></b><span>ATK</span><b data-cotd="atk" style="color:var(--gc-atk)"></b><span>HP</span><b data-cotd="hp" style="color:var(--gc-hp)"></b></div>
      </div>
      ${railHTML()}
    </section>
    <section class="b-cols" aria-label="Inside this update">
      <h2 class="b-h">Inside this update <small>${SECS.reduce((n, s) => n + s.items.length, 0)} changes</small></h2>
      <div class="b-cols__grid">${SECS.map((s, i) => `<details class="b-sec"${i === 0 ? " open" : ""}><summary>${use(s.icon)}${esc(s.name)}<b>${s.items.length}</b>${use("i-chev", "ico chev")}</summary><ul class="items">${itemsHTML(s)}</ul></details>`).join("")}</div>
    </section>
    <section class="b-fresh" aria-label="New arrivals">
      <h2 class="b-h">Fresh ink <small>Added ${fmtDate(COUNTS.newDate)} · ${newLine}</small></h2>
      <div class="hrow">${NEW_CARDS.map((id) => capHTML("n_" + id, id)).join("")}${NEW_SUP.map((id) => capHTML("s_" + id, id)).join("")}</div>
    </section>
    <section class="b-side" aria-label="New systems">
      <h2 class="b-h">In brief <small>New systems</small></h2>
      <ul class="b-brief">${NEWS.systems.map((s) => `<li><b>${esc(s.title)}</b><span>${esc(s.desc)}</span></li>`).join("")}</ul>
    </section>
  </div>`;
  function capHTML(file, id) { const c = CARDS[id]; return `<button class="cardcap" type="button">${img(file, c.name, 'loading="lazy"')}<span>${esc(c.name)}<b>1 IN ${shortNum(c.odds)}</b></span></button>`; }

  /* ==================== C · Lobby ==================== */
  const DRAW = {
    sotd: { tag: "Support of the Day", file: "sotd", c: CARDS[SOTD], lvl: "Normal" },
    cotd: { tag: "Card of the Day", file: "h_normal", c: cotd, lvl: null },
    lucky: { tag: "Lucky pull", file: "lucky", c: CARDS[LUCKY], lvl: "Rainbow" },
  };
  const drawHTML = (k, pos, up) => `<button class="flip c-draw c-draw--${pos}${up ? " is-up is-sel" : ""}" type="button" data-draw="${k}" aria-label="${DRAW[k].tag}">
      <span class="flip__in"><span class="flip__f">${img(DRAW[k].file, DRAW[k].c.name, k === "cotd" ? "data-cotd-img" : "")}<i class="a-card__flash"></i></span><span class="flip__b">${back()}</span></span>
      <span class="c-draw__tag">${DRAW[k].tag}</span></button>`;
  const PLATES = [["Cards", COUNTS.cards, "t_cards"], ["Support", COUNTS.support, "t_support"], ["Deck", "Build a team of 6", "t_deck"], ["Battle", "Guild Boss · Custom", "t_battle"]];
  $("#m-c").innerHTML = `
    <div class="c-stage">
      <div class="c-stage__head"><p class="hud">Today's draw</p><p class="hud hud--dim">New draw in <b data-count>--:--:--</b></p></div>
      <div class="c-table"><div class="c-floor"></div>${drawHTML("sotd", "l")}${drawHTML("cotd", "m", true)}${drawHTML("lucky", "r")}</div>
      <div class="c-read" style="margin-top:22px">
        <span class="lvlname" id="c-lvl">Normal</span>
        <b class="c-read__name" id="c-name">${esc(cotd.name)}</b>
        <div class="c-chips" id="c-chips"></div>
        <div class="c-railwrap" id="c-rail">${railHTML()}</div>
      </div>
    </div>
    <div class="c-codes" aria-label="Codes"><span class="hud">${use("i-gift")}Codes <b>${NEWS.codes.length}</b></span><div class="a-codes__row">${codesHTML()}</div></div>
    <div class="c-menu">${PLATES.map(([name, n, file]) => `<button class="plate press" type="button"><img src="img/${file}.webp" alt="" loading="lazy" width="300" height="400"><span class="hud">${name}</span><b class="${typeof n === "number" ? "" : "txt"}">${n}</b></button>`).join("")}</div>
    <section class="c-board" aria-label="Game update">
      <div class="c-board__head"><p><span class="kind">Major update</span><time class="date" datetime="${UPDATE.date}">${fmtDate(UPDATE.date)}</time></p><h2>${esc(UPDATE.title)}</h2></div>
      <div class="c-tiles" role="tablist" data-cats>${SECS.map((s, i) => `<button class="tile press" type="button" role="tab" aria-selected="${i === 0}" data-sec="${i}">${use(s.icon)}<span>${esc(s.name)}</span><b>${s.items.length}</b></button>`).join("")}</div>
      <div class="box"><ul class="items" style="margin:0" data-items>${itemsHTML(SECS[0])}</ul></div>
    </section>
    <section class="c-new" aria-label="New arrivals">
      <h2 class="sech">New arrivals <small>${newLine}</small></h2>
      <div class="c-new__track">${[0, 1].map((dup) => NEW_CARDS.map((id) => `<button type="button" ${dup ? 'tabindex="-1" aria-hidden="true"' : `aria-label="${esc(CARDS[id].name)}"`}>${img("n_" + id, dup ? "" : CARDS[id].name, 'loading="lazy"')}</button>`).join("")
        + NEW_SUP.map((id) => `<button type="button" ${dup ? 'tabindex="-1" aria-hidden="true"' : `aria-label="${esc(CARDS[id].name)}"`}>${img("s_" + id, dup ? "" : CARDS[id].name, 'loading="lazy"')}</button>`).join("")).join("")}</div>
    </section>
    <section class="c-sys" aria-label="New systems"><h2 class="sech">New systems</h2>${sysHTML()}</section>`;

  /* ---------- Card of the Day: the level changes the picture, the numbers and the colour of the page ---------- */
  const app = $("#app");
  let lvl = 0, sel = "cotd", tweenId = 0;
  const cotdStat = (key, i) => Math.round(cotd[key] * RAR[i].stat);
  function paintLvl(i, animate) {
    const from = lvl; lvl = i;
    const r = RAR[i];
    app.dataset.lvl = r.name.toLowerCase();
    $$("[data-cotd-img]").forEach((el) => { el.src = `img/h_${r.name.toLowerCase()}.webp`; });
    $$('[data-cotd="lvl"]').forEach((el) => { el.textContent = r.name; });
    $$('[data-cotd="odds"]').forEach((el) => { el.textContent = shortNum(cotd.odds * r.odds); });
    $$(".rail button").forEach((b) => b.setAttribute("aria-checked", String(+b.dataset.lvl === i)));
    const a0 = cotdStat("atk", from), a1 = cotdStat("atk", i), h0 = cotdStat("hp", from), h1 = cotdStat("hp", i);
    const put = (t) => {
      $$('[data-cotd="atk"]').forEach((el) => { el.textContent = fmtStat(a0 + (a1 - a0) * t); });
      $$('[data-cotd="hp"]').forEach((el) => { el.textContent = fmtHp(h0 + (h1 - h0) * t); });
    };
    cancelAnimationFrame(tweenId);
    if (!animate || reduced) { put(1); }
    else {
      const t0 = performance.now();
      const step = (now) => { const t = Math.min(1, (now - t0) / 650); put(1 - Math.pow(1 - t, 3)); if (t < 1) tweenId = requestAnimationFrame(step); };   // 650ms, then the loop stops
      tweenId = requestAnimationFrame(step);
      $$("[data-cotd-card], .c-draw--m").forEach((el) => { el.classList.remove("is-flash"); void el.offsetWidth; el.classList.add("is-flash"); });
    }
    if (sel === "cotd") paintRead();
  }
  function paintRead() {   // C: the readout under the table follows the card you picked
    const d = DRAW[sel], c = d.c, r = sel === "cotd" ? RAR[lvl] : RAR.find((x) => x.name === d.lvl);
    $("#c-name").textContent = c.name;
    $("#c-rail").hidden = sel !== "cotd";
    const pill = $("#c-lvl"); pill.textContent = r.name; pill.style.setProperty("--lvl", LVL[r.name]);
    $("#c-chips").innerHTML = `<span class="c-chip">1 IN <b>${shortNum(c.odds * r.odds)}</b></span>`
      + (c.atk ? `<span class="c-chip c-chip--atk">ATK <b>${fmtStat(c.atk * r.stat)}</b></span><span class="c-chip c-chip--hp">HP <b>${fmtHp(c.hp * r.stat)}</b></span>` : `<span class="c-chip">${esc(c.ab)}</span>`);
  }
  document.addEventListener("click", (e) => {
    const gem = e.target.closest(".rail button");
    if (gem) { paintLvl(+gem.dataset.lvl, true); return; }
    const code = e.target.closest("[data-code]");
    if (code) { copy(code); return; }
    const cat = e.target.closest("[data-sec]");
    if (cat) {
      const box = cat.closest("section"), list = $("[data-items]", box);
      $$("[data-sec]", box).forEach((b) => b.setAttribute("aria-selected", String(b === cat)));
      hit(cat);
      list.classList.remove("is-in"); list.innerHTML = itemsHTML(SECS[+cat.dataset.sec]); void list.offsetWidth; list.classList.add("is-in");
      return;
    }
    const draw = e.target.closest("[data-draw]");
    if (draw) {
      draw.classList.add("is-up");
      $$(".c-draw").forEach((d) => d.classList.toggle("is-sel", d === draw));
      sel = draw.dataset.draw; paintRead();
      return;
    }
    const go = e.target.closest("[data-go]");
    if (go) { show(go.dataset.go, true); return; }
    const p = e.target.closest(".press");
    if (p) hit(p);
  });
  async function copy(btn) {
    const code = btn.dataset.code;
    hit(btn);
    let ok = false;
    try { await navigator.clipboard.writeText(code); ok = true; } catch (err) { ok = false; }
    if (ok) { btn.classList.add("is-done"); const u = $("use", btn); if (u) u.setAttribute("href", "#i-check"); toast("Copied " + code); }
    else toast("Couldn't copy. Press and hold the code.");
  }

  /* ---------- A: open the pack → the new cards turn over one by one ---------- */
  $("#open").addEventListener("click", () => {
    const pack = $("#pack"), pull = $("#pull");
    pack.classList.add("is-open"); $("#open").hidden = true;
    setTimeout(() => {
      pull.hidden = false; $("#pull-more").hidden = false;
      $$(".flip", pull).forEach((f, i) => setTimeout(() => f.classList.add("is-up"), reduced ? 0 : 90 * i + 60));
    }, reduced ? 0 : 520);
  });

  /* ---------- countdown to the next Card of the Day (local midnight) ---------- */
  function tick() {
    const now = new Date(), next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const s = Math.max(0, Math.floor((next - now) / 1000)), p = (n) => String(n).padStart(2, "0");
    const text = `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
    $$("[data-count]").forEach((el) => { el.textContent = text; });
  }
  tick(); setInterval(tick, 1000);

  /* ---------- the scene follows the clock and the season (Auto) · the button steps through them for the mockup ---------- */
  const SCENES = ["auto", "night", "dusk", "dawn", "snow"];
  let scene = "auto";
  function autoScene() {
    const d = new Date(), h = d.getHours();
    if (d.getMonth() === 11) return "snow";            // December
    if (h >= 5 && h < 8) return "dawn";
    if (h >= 17 && h < 19) return "dusk";
    return "night";
  }
  function paintScene() {
    const real = scene === "auto" ? autoScene() : scene;
    app.dataset.scene = real;
    $("#scene-btn").textContent = "Scene: " + (scene === "auto" ? "Auto (" + cap(real) + ")" : cap(scene));
    const snow = $("#snow");
    if (real === "snow" && !snow.childElementCount) {
      let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      snow.innerHTML = Array.from({ length: 26 }, () => { const s = 2 + rnd() * 3;
        return `<i style="left:${(rnd() * 100).toFixed(1)}%;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;--dx:${(rnd() * 60 - 30).toFixed(0)}px;--rest:${(rnd() * 90).toFixed(0)}vh;animation-duration:${(7 + rnd() * 8).toFixed(1)}s;animation-delay:-${(rnd() * 12).toFixed(1)}s"></i>`; }).join("");
    }
  }
  $("#scene-btn").addEventListener("click", () => { scene = SCENES[(SCENES.indexOf(scene) + 1) % SCENES.length]; paintScene(); });

  /* ---------- A / B / C ---------- */
  function show(m, user) {
    if (!["a", "b", "c"].includes(m)) m = "a";
    const swap = () => {
      app.dataset.m = m;
      ["a", "b", "c"].forEach((k) => { $("#m-" + k).hidden = k !== m; });
      $$("[data-go]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.go === m)));
      const el = $("#m-" + m); el.classList.remove("is-in"); void el.offsetWidth; el.classList.add("is-in");
      if (user) { window.scrollTo(0, 0); try { history.replaceState(null, "", "#" + m); } catch (err) { /* sandboxed viewers */ } }
    };
    if (user) vt(swap); else swap();
  }
  if (matchMedia("(min-width: 1100px)").matches) $$(".b-sec").forEach((d) => { d.open = true; });
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  paintLvl(0, false); paintRead(); paintScene(); show(location.hash.slice(1) || "a");
  // the other 8 levels of the day's card load when the page is idle, so a tap on a gem swaps at once
  const warm = () => RAR.slice(1).forEach((r) => { new Image().src = `img/h_${r.name.toLowerCase()}.webp`; });
  if ("requestIdleCallback" in window) requestIdleCallback(warm, { timeout: 2500 }); else setTimeout(warm, 1200);
})();
</script>
