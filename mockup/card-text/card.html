<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111;display:flex;gap:24px;padding:24px}
.card{position:relative;width:600px;height:840px;border-radius:22px;overflow:hidden;font-family:Oswald,sans-serif;color:#fff;box-sizing:border-box}
.card img{position:absolute;inset:0;width:100%;height:100%}
.top{position:absolute;left:0;width:72%;top:0;height:110px;background:radial-gradient(120% 100% at 0 0,#000c,#0000 70%)}
.bot{position:absolute;left:0;right:0;bottom:0;height:430px;background:linear-gradient(#0000,#05040ae0 26%,#05040acc 62%,#05040a00 92%)}
.name{position:absolute;left:22px;right:96px;top:20px;font:400 42px/1 Bangers;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 #000,0 0 8px #000}
.box{position:absolute;left:30px;right:30px;top:468px;bottom:118px;display:flex;flex-direction:column}
.skill{font:400 44px/1 Bangers;letter-spacing:1px;background:linear-gradient(#f6d3ff,#c06bff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000);margin-bottom:10px}
.desc{font-weight:500;font-size:23px;line-height:1.32;color:#eee;text-shadow:0 1px 2px #000}
.desc b{color:#ffcf5a;font-weight:700}
.stat{position:absolute;font:700 30px/1 Oswald;text-shadow:0 2px 3px #000}
.card{container-type:inline-size}
.gc__hp,.gc__atk{position:absolute;z-index:4;display:flex;align-items:center;white-space:nowrap}
.gc__hp{left:40cqw;width:43.2cqw;top:3.2cqw;height:14.4cqw;justify-content:flex-end}
.gc__atk{left:21.5cqw;width:57.5cqw;top:122.6cqw;height:15.6cqw;justify-content:center}
.gc__num{display:inline-block;font-family:Oswald;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;paint-order:stroke fill;-webkit-text-stroke:var(--sw) var(--line)}
.gc__hp .gc__num{font-size:12.4cqw;color:#52b257;--sw:1.5cqw;--line:#000a03;text-shadow:0 .5cqw 0 #000a03}
.gc__atk .gc__num{font-size:14.2cqw;color:#ec453b;--sw:.9cqw;--line:#2a0101;text-shadow:0 .35cqw 0 rgba(0,0,0,.5)}
.name2{font:400 30px/1 Bangers;letter-spacing:1px;color:#fff;text-shadow:0 2px 0 #000,0 0 8px #000;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box{top:440px!important}
</style></head><body>
<div class="card"><img src="dem_clean.png"><div class="top"></div><div class="bot"></div>
<div class="name">Dragon Emperor Monarch</div>
<div class="gc__hp"><span class="gc__num">8.9M</span></div><div class="gc__atk"><span class="gc__num">1,333,153</span></div><div class="box" style="top:468px!important"><div class="skill">Monarch of Destruction</div>
<div class="desc" id="d">Antares' dragon fear. Every enemy card starts with <b>6.4%</b> less damage. Every hit sets the whole enemy deck on fire for <b>2 turns</b>. Every hit also hits the whole enemy bench for <b>20%</b>. Instantly kills enemies under <b>5% HP</b> (not bosses).</div></div>
</div>
<script>
function fitName(n){let s=42;n.style.fontSize=s+'px';n.style.transformOrigin='0 50%';n.style.overflow='visible';
 const W=n.clientWidth;let w=n.scrollWidth;
 while(w*0.82>W&&s>16){n.style.fontSize=(--s)+'px';w=n.scrollWidth}
 if(w>W){n.style.transform='scaleX('+(W/w)+')';n.style.width=w+'px';n.style.right='auto'}}
// auto-shrink text until it fits inside the box
document.fonts.ready.then(()=>{document.querySelectorAll('.box').forEach(b=>{const d=b.querySelector('.desc');let s=30;d.style.fontSize=s+'px';while(b.scrollHeight>b.clientHeight&&s>14){d.style.fontSize=(--s)+'px'}});document.querySelectorAll('.card').forEach(c=>{const n=c.querySelector('.name'),hp=c.querySelector('.gc__hp .gc__num');if(!n||!hp)return;const cr=c.getBoundingClientRect();n.style.right=(cr.right-hp.getBoundingClientRect().left+14)+'px';n.style.textOverflow='clip';fitName(n)});document.body.dataset.ready=1})
</script></body></html>
