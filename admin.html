<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin · Card Battle Infinity</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Admin</h1>
    <div class="sub"><a href="./">← Back to site</a> <span id="who"></span></div>
    <nav class="tabs hidden" id="tabs">
      <button data-page="cards">Cards</button>
      <button data-page="edit">+ Add card</button>
      <button data-page="rarities">Rarities</button>
      <button data-page="mutations">Mutations</button>
      <button id="logout">Log out</button>
    </nav>
  </header>

  <main>
    <!-- Login -->
    <section id="page-login" class="panel">
      <form id="loginForm">
        <label>Admin key (GitHub token)</label>
        <input type="password" id="token" required autocomplete="off" placeholder="github_pat_…">
        <div class="muted">Saved only on this device.</div>
        <button class="primary" style="width:100%;margin-top:14px">Log in</button>
        <div class="muted" id="loginMsg" style="margin-top:8px"></div>
      </form>
    </section>

    <section id="page-cards" class="panel hidden"><div id="cardList"></div></section>

    <section id="page-edit" class="panel hidden">
      <form id="cardForm">
        <h3 id="formTitle" style="margin-top:0">Add card</h3>
        <label>Card image</label>
        <div class="row">
          <img id="imgPrev" alt="" style="max-width:120px;border-radius:10px;flex:none" class="hidden">
          <input type="file" id="imgFile" accept="image/*">
        </div>
        <label>Name</label><input id="fName" required>
        <label>Rarity</label><select id="fRarity"></select>
        <div id="fStats" class="row"></div>
        <label>Passive</label><textarea id="fPassive"></textarea>
        <label>Skill</label><textarea id="fSkill"></textarea>
        <div id="fTags"></div>
        <label>Tier</label><select id="fTier"></select>
        <label>Notes</label><textarea id="fNotes"></textarea>
        <div class="row" style="margin-top:16px">
          <button type="button" id="cancelEdit">Cancel</button>
          <button class="primary" id="saveBtn">Save card</button>
        </div>
      </form>
    </section>

    <section id="page-rarities" class="panel hidden"></section>
    <section id="page-mutations" class="panel hidden"></section>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
